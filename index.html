<style>
:root{

/* Filtros estilo Excel */

.zoom-box{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #d9dfda;border-radius:8px;padding:2px}

td.cell-selected{background:#dbe9ff!important}

.animals-page table,.iatf-page table,.stock-page table{font-size:11px}
.animals-page th,.iatf-page th,.stock-page th{padding:7px 7px;font-size:9.5px}

/* LOGIN FIREBASE */
body.auth-pending .app,body.auth-logged-out .app{display:none!important}

.login-card{width:min(390px,100%);background:#fff;border:1px solid #e1e7e2;border-radius:14px;padding:28px;box-shadow:0 8px 30px #00000010}

</head>
<body class="auth-pending">

<script>
const DEFAULT_DB={"animals":[],"semen":[],"iatf":[],"meta":{"activeSeasonId":"season-2026-27"},"seasons":[{"id":"season-2026-27","name":"Estação 2026/27","startDate":"2026-07-01","endDate":"2027-06-30","active":true}],"settings":{"bullMinUses":5,"bullPriorStrength":5,"lowStock":3}};
const STORE='iatf-mra-v6-firebase';
const FIREBASE_CONFIG={
  apiKey:'AIzaSyBW7ih1ARuEnkuA1W9YANiGtBPM4OXw1Ck',
  authDomain:'iatf-mra.firebaseapp.com',
  projectId:'iatf-mra',
  storageBucket:'iatf-mra.firebasestorage.app',
  messagingSenderId:'667475070357',
  appId:'1:667475070357:web:517a4b9605f6114ae2ba9c'
};
let firestore=null, stateRef=null, syncTimer=null, unsubscribeFirestore=null, applyingRemote=false, lastRemoteJSON='';

let db=null,page='dashboard',iatfCategory='',iatfCycle=1,animalSelecting=false,animalSelected=new Set();
let undoStack=[],undoBaselineJSON='',suppressUndoHistory=false,localWritePending=false;
const UNDO_LIMIT=50;
let animalSort={key:'',dir:1},iatfSort={key:'',dir:1},stockSort={key:'',dir:1};
let animalFilters={rgd:'',firstSire:'',category:'',status:''};
let iatfFilters={rgd:'',firstSire:'',qty:'',result:'',category:'',cycle:1};
let stockFilters={name:'',rgdTouro:'',tank:'',caneca:'',saldo:''};
let excelFilters={animals:{},iatf:{},stock:{},acasal:{},embrioes:{},fiv:{}};

let embrioesSort={key:'',dir:1};
let fivSort={key:'',dir:1};
let excelFilterContext=null;

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const norm=s=>String(s??'').trim().toUpperCase();
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const fmtDate=s=>{if(!s)return'';const [y,m,d]=String(s).slice(0,10).split('-');return y&&m&&d?`${d}/${m}/${y}`:s};
const csvSafe=s=>String(s??'');
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function migrate(x){
  x=x||deepClone(DEFAULT_DB);
  x.seasons=x.seasons||[{id:'season-2026-27',name:'Estação 2026/27',startDate:'2026-07-01',endDate:'2027-06-30',active:true}];
  x.settings={bullMinUses:5,bullPriorStrength:5,...(x.settings||{})};
  x.meta=x.meta||{};x.meta.activeSeasonId=x.meta.activeSeasonId||x.seasons[0].id;
  x.cycleDates=x.cycleDates||{};
  x.iatfCycleCategories=x.iatfCycleCategories||{};
  x.iatfMaxCycles=x.iatfMaxCycles||{};
  x.animals=x.animals||[];x.semen=x.semen||[];x.iatf=x.iatf||[];
  x.deletedAnimals=x.deletedAnimals||[];
  x.acasalamentos=x.acasalamentos||[];
  x.acasalamentos.forEach(a=>{if(!a.createdAt)a.createdAt='2026-08-30'});
  x.naoUtilizadas=x.naoUtilizadas||[];
  x.embrioes=x.embrioes||[];
  x.fiv=x.fiv||[];
  x.iatfExcluded=x.iatfExcluded||[];
  x.animals.forEach(a=>{a.active=true;if(!a.seasonId)a.seasonId=x.meta.activeSeasonId;if(!a.createdAt)a.createdAt='2026-08-30'});
  (x.deletedAnimals||[]).forEach(d=>{if(d.animal&&!d.animal.seasonId)d.animal.seasonId=x.meta.activeSeasonId});

  // --- MIGRAÇÃO v7: o "touro" passa a ser o antigo NOME DO BOTIJÃO ---
  // Onde o nome do botijão estava vazio, mantém o cadastro antigo (joga pro lado).
  if(!x.meta.stockMigrated_v7){
    const rename={};
    (x.semen||[]).forEach(s=>{
      const novo=String(s.tankName||'').trim()||String(s.name||'').trim();
      if(novo && novo!==s.name) rename[s.name]=novo;
      s.name=novo;
    });
    // remapeia acasalamentos das matrizes e das IATFs
    (x.animals||[]).forEach(a=>{if(rename[a.firstSire])a.firstSire=rename[a.firstSire]});
    (x.iatf||[]).forEach(r=>{
      if(rename[r.firstSire])r.firstSire=rename[r.firstSire];
      if(rename[r.secondSire])r.secondSire=rename[r.secondSire];
    });
    // junta eventuais duplicados criados pela fusão
    const byName={};const merged=[];
    (x.semen||[]).forEach(s=>{
      const k=norm(s.name);
      if(!k)return;
      if(byName[k]){
        byName[k].initial=Number(byName[k].initial||0)+Number(s.initial||0);
        byName[k].tank=byName[k].tank||s.tank;
        byName[k].caneca=byName[k].caneca||s.caneca;
      }else{byName[k]=s;merged.push(s)}
    });
    x.semen=merged;
    x.meta.stockMigrated_v7=true;
  }

  // --- MIGRAÇÃO v8: padroniza TUPA como TUPA MRA no estoque e nos vínculos ---
  if(!x.meta.tupaMra_v8){
    (x.semen||[]).forEach(s=>{if(norm(s.name)==='TUPA')s.name='TUPA MRA'});
    (x.animals||[]).forEach(a=>{if(norm(a.firstSire)==='TUPA')a.firstSire='TUPA MRA'});
    (x.iatf||[]).forEach(r=>{if(norm(r.firstSire)==='TUPA')r.firstSire='TUPA MRA';if(norm(r.secondSire)==='TUPA')r.secondSire='TUPA MRA'});
    (x.deletedAnimals||[]).forEach(d=>{
      if(d.animal&&norm(d.animal.firstSire)==='TUPA')d.animal.firstSire='TUPA MRA';
      (d.iatf||[]).forEach(r=>{if(norm(r.firstSire)==='TUPA')r.firstSire='TUPA MRA';if(norm(r.secondSire)==='TUPA')r.secondSire='TUPA MRA'});
    });
    x.meta.tupaMra_v8=true;
  }

  x.semen.forEach(s=>{
    s.active=true;
    s.rgdTouro=s.rgdTouro||'';
    s.addedDate=s.addedDate||'';
    if(s.usedOverride===undefined)s.usedOverride=null;
    delete s.tankName;
  });
  x.iatf.forEach(r=>{
    r.seasonId=r.seasonId||x.meta.activeSeasonId;
    if(r.date && !((x.cycleDates[r.seasonId]||{})[r.cycle])){
      x.cycleDates[r.seasonId]=x.cycleDates[r.seasonId]||{};
      x.cycleDates[r.seasonId][r.cycle]=r.date;
    }
    delete r.date;
    r.firstSire=String(r.firstSire||'').trim();
    r.secondSire=String(r.secondSire||'').trim();
    r.return=r.return||'';
    r.qty=Number(r.qty||0); r.result=normResult(r.result);
  });
  // Reconciliação: se a matriz chegou sem 1º acasalamento mas já existe um lançamento de IATF dela
  // com o acasalamento preenchido (dados restaurados/importados fora do fluxo normal de edição),
  // puxa esse valor pra Matriz. O inverso também vale: matriz com acasalamento/categoria preenchidos
  // "empresta" o valor pros lançamentos de IATF dela que ainda estiverem vazios/desatualizados.
  (x.animals||[]).forEach(a=>{
    const rows=(x.iatf||[]).filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd));
    if(!rows.length)return;
    if(!a.firstSire){
      const withSire=rows.find(r=>r.firstSire);
      if(withSire)a.firstSire=withSire.firstSire;
    }
    rows.forEach(r=>{
      if(!r.firstSire && a.firstSire)r.firstSire=a.firstSire;
      if(a.category)r.category=a.category;
    });
  });
  // Categorias vinculadas a cada IATF. Na primeira migração, infere das linhas já existentes.
  if(!x.meta.iatfCycleCategories_v9){
    (x.iatf||[]).forEach(r=>{
      const sid=r.seasonId||x.meta.activeSeasonId, cy=String(Number(r.cycle)||1);
      x.iatfCycleCategories[sid]=x.iatfCycleCategories[sid]||{};
      x.iatfCycleCategories[sid][cy]=x.iatfCycleCategories[sid][cy]||[];
      if(r.category&&!x.iatfCycleCategories[sid][cy].includes(r.category))x.iatfCycleCategories[sid][cy].push(r.category);
    });
    x.meta.iatfCycleCategories_v9=true;
  }
  // --- MIGRAÇÃO v10: Acasalamentos, Não Utilizadas e FIV passam a pertencer a uma estação
  // (igual Matrizes/IATF já eram). Nada é apagado — os lançamentos que já existiam viram
  // pertencentes à estação que estava ativa até agora, então continuam exatamente onde estavam.
  if(!x.meta.seasonScopedExtras_v10){
    (x.acasalamentos||[]).forEach(a=>{if(!a.seasonId)a.seasonId=x.meta.activeSeasonId});
    (x.naoUtilizadas||[]).forEach(a=>{if(!a.seasonId)a.seasonId=x.meta.activeSeasonId});
    (x.fiv||[]).forEach(a=>{if(!a.seasonId)a.seasonId=x.meta.activeSeasonId});
    x.meta.seasonScopedExtras_v10=true;
  }
  (x.fiv||[]).forEach(f=>{if(f.data===undefined)f.data=''});
  return x
}
// PRT substitui o antigo "M" (matar). PRT conta como não-prenha nos cálculos.
function normResult(v){v=norm(v);if(v==='M')v='PRT';return ['P','V','PRT'].includes(v)?v:''}
function setSyncStatus(kind,text){
  const dot=$('#syncDot'), s=$('#saveStatus');
  const colors={ok:'#6fd598',saving:'#e0b84f',error:'#e35d50',offline:'#e35d50'};
  if(dot)dot.style.background=colors[kind]||colors.saving;
  if(s)s.textContent=text||({ok:'Sincronizado',saving:'Salvando...',error:'Problema de conexão',offline:'Problema de conexão'}[kind]||'Conectando...');
}
function updateUndoButton(){
  const b=$('#undoBtn');if(b)b.disabled=!undoStack.length;
}
function resetUndoBaseline(clearHistory=false){
  undoBaselineJSON=JSON.stringify(deepClone(db));
  if(clearHistory)undoStack=[];
  updateUndoButton();
}
function registerUndoSnapshot(){
  const current=JSON.stringify(deepClone(db));
  if(!undoBaselineJSON){undoBaselineJSON=current;return}
  if(current===undoBaselineJSON)return;
  if(!suppressUndoHistory){
    undoStack.push(undoBaselineJSON);
    if(undoStack.length>UNDO_LIMIT)undoStack.shift();
  }
  undoBaselineJSON=current;
  updateUndoButton();
}
function undoLastChange(){
  if(!undoStack.length)return;
  closeExcelFilter();
  clearTimeout(syncTimer);
  const previous=undoStack.pop();
  suppressUndoHistory=true;
  try{
    db=migrate(JSON.parse(previous));
    undoBaselineJSON=JSON.stringify(deepClone(db));
    try{localStorage.setItem(STORE,undoBaselineJSON)}catch(e){console.warn('Cache local:',e)}
    render();
    // Desfazer é uma nova alteração local: volta o estado e grava a reversão no Firebase.
    localWritePending=true;
    setSyncStatus('saving','Salvando desfazer...');
    syncTimer=setTimeout(syncToFirestore,0);
  }finally{suppressUndoHistory=false;updateUndoButton()}
}
window.undoLastChange=undoLastChange;
let lastLocalEditAt=0;
const PENDING_KEY=STORE+'-pending';
function save(renderToo=false){
  registerUndoSnapshot();
  try{
    localStorage.setItem(STORE,JSON.stringify(db));
    // Marca que existe uma alteração ainda não confirmada no Firebase. Só some quando o envio
    // realmente terminar com sucesso — é o que impede um F5 rápido demais de "desfazer" sua
    // edição (antes, ao recarregar, a tela sempre confiava mais no Firebase do que no que você
    // tinha acabado de fazer, e como o Firebase ainda não tinha recebido, ele te atropelava).
    localStorage.setItem(PENDING_KEY,'1');
  }catch(e){console.warn('Cache local:',e)}
  if(renderToo)render();
  if(applyingRemote)return;
  lastLocalEditAt=Date.now();
  localWritePending=true;
  setSyncStatus('saving','Salvando...');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncToFirestore,250);
}
async function syncToFirestore(){
  if(!stateRef){setSyncStatus('error','Problema de conexão');return}
  try{
    const clean=deepClone(db);
    await stateRef.set({db:clean,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    lastRemoteJSON=JSON.stringify(clean);
    localWritePending=false;
    try{localStorage.removeItem(PENDING_KEY)}catch(e){}
    setSyncStatus('ok','Sincronizado');
  }catch(e){
    console.error('Erro ao sincronizar com Firestore:',e);
    localWritePending=false;
    // NÃO remove o PENDING_KEY aqui — o envio falhou de verdade, então a proteção contra F5
    // continua valendo (e a próxima abertura do app tenta reenviar sozinha).
    setSyncStatus('error','Problema de conexão');
  }
}

function activeSeason(){return db.seasons.find(s=>s.id===db.meta.activeSeasonId)||db.seasons[0]}
function seasonRows(){return db.iatf.filter(r=>r.seasonId===db.meta.activeSeasonId)}
function seasonAnimals(sid=db.meta.activeSeasonId){return db.animals.filter(a=>a.seasonId===sid)}
function seasonAcasal(sid=db.meta.activeSeasonId){return (db.acasalamentos||[]).filter(a=>a.seasonId===sid)}
function seasonNaoUtil(sid=db.meta.activeSeasonId){return (db.naoUtilizadas||[]).filter(a=>a.seasonId===sid)}
function seasonFiv(sid=db.meta.activeSeasonId){return (db.fiv||[]).filter(a=>a.seasonId===sid)}
function cycleDate(c){return ((db.cycleDates||{})[db.meta.activeSeasonId]||{})[Number(c)]||''}
function setCycleDate(c,v){db.cycleDates[db.meta.activeSeasonId]=db.cycleDates[db.meta.activeSeasonId]||{};db.cycleDates[db.meta.activeSeasonId][Number(c)]=v;save()}
function sireNames(){return [...new Set(db.semen.map(s=>String(s.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function sireExists(name){const n=norm(name);return sireNames().some(x=>norm(x)===n)}
function bullDatalist(){return `<datalist id="bullsList">${sireNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`}
function usedSemen(){const u={};db.iatf.forEach(r=>{const s=String(r.firstSire||'').trim();if(s&&Number(r.qty)>0)u[s]=(u[s]||0)+Number(r.qty)});return u}
function usedAuto(s){return usedSemen()[s.name]||0}
function usedEffective(s){return (s.usedOverride===null||s.usedOverride===undefined)?usedAuto(s):Number(s.usedOverride||0)}
function stockBalance(s){return Number(s.initial||0)-usedEffective(s)}
function normalizedResult(r){return normResult(r)}
function isDiagnosed(r){return ['P','V','PRT'].includes(normResult(r))}
function latestStatus(rgd){
  const rows=seasonRows().filter(r=>r.rgd===rgd&&isDiagnosed(r.result)).sort((a,b)=>Number(b.cycle)-Number(a.cycle));
  return rows.length?normResult(rows[0].result):''
}
function catClass(c){return c==='Vacas'?'cat-vacas':c==='Primíparas'?'cat-primi':'cat-preco'}
function resClass(r){return r==='P'?'res-p':r==='V'?'res-v':r==='PRT'?'res-m':'res-none'}
function statusLabel(r){return r==='P'?'Prenha':r==='V'?'Vazia':r==='PRT'?'PRT':'Sem resultado'}
function title(t,s){$('#pageTitle').textContent=t;$('#pageSub').textContent=s||''}
function openModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
window.closeModal=closeModal;

async function init(){
  let localDb;
  let hadPendingWrite=false;
  try{
    const saved=localStorage.getItem(STORE);
    localDb=migrate(saved?JSON.parse(saved):deepClone(DEFAULT_DB));
    hadPendingWrite=!!localStorage.getItem(PENDING_KEY);
  }catch(e){
    console.warn('Não foi possível ler o cache local:',e);
    localDb=migrate(deepClone(DEFAULT_DB));
  }
  db=localDb;
  resetUndoBaseline(true);
  bind();
  render();
  setSyncStatus('saving','Conectando...');
  try{
    if(!window.firebase)throw new Error('SDK do Firebase não carregou. Verifique a internet.');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    firestore=firebase.firestore();
    stateRef=firestore.collection('iatfApp').doc('state');
    if(hadPendingWrite){
      // Da última vez que o app rodou, teve uma alteração que ainda não tinha sido confirmada
      // no Firebase (provavelmente a página foi recarregada rápido demais logo depois de editar
      // algo). Em vez de puxar o que está no Firebase — que estaria desatualizado e apagaria
      // essa edição de novo — manda o que está salvo localmente PRIMEIRO, pra não perder nada.
      setSyncStatus('saving','Terminando de salvar uma alteração pendente...');
      await syncToFirestore();
      lastRemoteJSON=JSON.stringify(deepClone(db));
    }
    const snap=hadPendingWrite?null:await stateRef.get();
    if(snap && snap.exists && snap.data() && snap.data().db){
      applyingRemote=true;
      db=migrate(snap.data().db);
      localStorage.setItem(STORE,JSON.stringify(db));
      lastRemoteJSON=JSON.stringify(deepClone(db));
      resetUndoBaseline(true);
      applyingRemote=false;
      render();
      setSyncStatus('ok','Sincronizado');
    }else if(!hadPendingWrite){
      // Primeira abertura: envia a base atual da V6 ao Firestore.
      await stateRef.set({db:deepClone(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      lastRemoteJSON=JSON.stringify(deepClone(db));
      setSyncStatus('ok','Sincronizado');
    }
    unsubscribeFirestore=stateRef.onSnapshot(s=>{
      if(!s.exists || !s.data() || !s.data().db)return;
      const incoming=migrate(s.data().db);
      const incomingJSON=JSON.stringify(deepClone(incoming));
      if(incomingJSON===lastRemoteJSON)return;
      // Se o Firestore devolveu exatamente o estado que já está na tela, é o nosso próprio salvamento.
      // Atualiza só o status e NÃO renderiza a página inteira (evita pulo de rolagem/foco).
      const currentJSON=JSON.stringify(deepClone(db));
      if(incomingJSON===currentJSON){lastRemoteJSON=incomingJSON;setSyncStatus('ok','Sincronizado');return}
      // Enquanto há uma gravação local (inclusive Desfazer), ignora um snapshot remoto antigo
      // para ele não apagar a alteração nem limpar o histórico. Também ignora nos 1.5s logo após
      // qualquer edição local — evita que um "eco" do Firestore, chegando um pouquinho atrasado
      // enquanto você ainda está digitando em outra célula, sobrescreva algo que você acabou de
      // digitar e ainda não deu tempo de sincronizar (era uma causa provável de valor "sumindo").
      if(localWritePending || (Date.now()-lastLocalEditAt)<1500)return;
      applyingRemote=true;
      db=incoming;
      lastRemoteJSON=incomingJSON;
      try{localStorage.setItem(STORE,incomingJSON)}catch(e){}
      // Mudança realmente vinda de outro dispositivo: atualiza a base, mas NÃO apaga o histórico local.
      resetUndoBaseline(false);
      applyingRemote=false;
      render();
      setSyncStatus('ok','Sincronizado');
    },err=>{
      console.error('Listener Firestore:',err);
      setSyncStatus('error','Problema de conexão');
    });
    window.addEventListener('online',()=>{setSyncStatus('saving','Reconectando...');syncToFirestore()});
    window.addEventListener('offline',()=>setSyncStatus('offline','Problema de conexão'));
  }catch(e){
    console.error('Erro ao conectar ao Firebase:',e);
    setSyncStatus('error','Problema de conexão');
  }
}

function bind(){
  $$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
  $('#modalClose').onclick=closeModal;
  $('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
  $('#seasonHeader').onchange=e=>{db.meta.activeSeasonId=e.target.value;save();render()};
  $('#animalImportFile').onchange=e=>{importAnimalsExcel(e.target.files[0]);e.target.value=''};
  $('#stockImportFile').onchange=e=>{importStockExcel(e.target.files[0]);e.target.value=''};
  $('#backupRestoreFile').onchange=e=>{restoreFullBackup(e.target.files[0]);e.target.value=''};
  $('#acasalImportFile').onchange=e=>{importAcasalExcel(e.target.files[0]);e.target.value=''};
  $('#naoUtilImportFile').onchange=e=>{importNaoUtilizadasExcel(e.target.files[0]);e.target.value=''};
  $('#embrioesImportFile').onchange=e=>{importEmbrioesExcel(e.target.files[0]);e.target.value=''};
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&String(e.key).toLowerCase()==='z'){
      e.preventDefault();
      const active=document.activeElement;
      if(active&&typeof active.blur==='function')active.blur();
      setTimeout(undoLastChange,0);
    }
  });
}
function go(p){page=p;$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
window.go=go;
function renderSeasonSelector(){
  $('#seasonHeader').innerHTML=db.seasons.map(s=>`<option value="${esc(s.id)}" ${s.id===db.meta.activeSeasonId?'selected':''}>${esc(s.name)}</option>`).join('')
}
let tableZoomPct=100;
function applyTableZoom(){
  document.querySelectorAll('.table-wrap').forEach(w=>{w.style.zoom=(tableZoomPct/100)});
}
function zoomTable(delta){
  tableZoomPct=Math.max(50,Math.min(150,tableZoomPct+delta));
  applyTableZoom();
  $$('.zoom-label').forEach(l=>l.textContent=tableZoomPct+'%');
} window.zoomTable=zoomTable;
function zoomControlsHTML(){
  return `<div class="zoom-box"><button class="mini" type="button" onclick="zoomTable(-10)" title="Diminuir">−</button><span class="zoom-label">${tableZoomPct}%</span><button class="mini" type="button" onclick="zoomTable(10)" title="Aumentar">+</button></div>`;
}
function captureViewPosition(){
  const wraps={};
  document.querySelectorAll('.table-wrap').forEach((el,i)=>{
    const host=el.closest('[id]');
    const key=(host?host.id:'wrap')+':'+i;
    wraps[key]={top:el.scrollTop,left:el.scrollLeft};
  });
  return {x:window.scrollX,y:window.scrollY,wraps};
}
function restoreViewPosition(pos){
  if(!pos)return;
  const apply=()=>{
    window.scrollTo(pos.x,pos.y);
    document.querySelectorAll('.table-wrap').forEach((el,i)=>{
      const host=el.closest('[id]');
      const key=(host?host.id:'wrap')+':'+i;
      const st=pos.wraps[key];
      if(st){el.scrollTop=st.top;el.scrollLeft=st.left}
    });
    applyTableZoom();
  };
  apply();requestAnimationFrame(()=>{apply();requestAnimationFrame(apply)});
}
function render(){
  const __view=captureViewPosition();
  renderSeasonSelector();
  if(page==='dashboard')dashboard();
  else if(page==='animals')animals();
  else if(page==='acasal')acasalPage();
  else if(page==='fiv')fivPage();

/* ===== MINI-EXCEL ==================================================================
   Seleção de intervalo (clica e arrasta, ou Shift+seta), copiar (Ctrl+C), colar (Ctrl+V)
   e "preencher pra baixo" arrastando o quadradinho azul do canto — funciona sozinho em
   QUALQUER tabela editável do sistema (Matrizes, IATF, Acasalamentos, Embriões, FIV,
   Estoque), sem precisar mexer em cada tela: fica escutando o documento inteiro. */
let gridDown=false, gridAnchor=null, gridFocusCell=null, gridFillFrom=null, gridFillDragging=false;
function gridInfo(cellInput){
  const td=cellInput.closest('td');const tr=td&&td.closest('tr');const tbody=tr&&tr.closest('tbody');
  if(!td||!tr||!tbody)return null;
  const table=tbody.closest('table');
  const r=Array.prototype.indexOf.call(tbody.children,tr);
  const c=Array.prototype.indexOf.call(tr.children,td);
  return {table,tbody,tr,td,cellInput,r,c};
}
function gridCellInputAt(table,r,c){
  const tbody=table.tBodies[0];if(!tbody)return null;
  const tr=tbody.children[r];if(!tr)return null;
  const td=tr.children[c];if(!td)return null;
  return td.querySelector('.cell-input')||null;
}
function gridClear(table){
  if(!table)return;
  table.querySelectorAll('.cell-selected').forEach(td=>td.classList.remove('cell-selected'));
  const h=table.querySelector('.fill-handle');if(h)h.remove();
}
function gridHighlight(table,r1,c1,r2,c2){
  gridClear(table);
  const rlo=Math.min(r1,r2),rhi=Math.max(r1,r2),clo=Math.min(c1,c2),chi=Math.max(c1,c2);
  const tbody=table.tBodies[0];if(!tbody)return;
  let lastTd=null;
  for(let r=rlo;r<=rhi;r++){
    const tr=tbody.children[r];if(!tr)continue;
    for(let c=clo;c<=chi;c++){
      const td=tr.children[c];if(!td)continue;
      if(td.querySelector('.cell-input')){td.classList.add('cell-selected');lastTd=td}
    }
  }
  if(lastTd){
    const handle=document.createElement('div');
    handle.className='fill-handle';
    handle.addEventListener('mousedown',e=>{
      e.preventDefault();e.stopPropagation();
      gridFillDragging=true;
      gridFillFrom={table,r1:rlo,r2:rhi,c1:clo,c2:chi};
    });
    lastTd.style.position='relative';
    lastTd.appendChild(handle);
  }
}
function gridSelectionOf(table){
  const cells=table.querySelectorAll('.cell-selected');
  if(!cells.length)return null;
  let r1=Infinity,r2=-1,c1=Infinity,c2=-1;
  cells.forEach(td=>{
    const tr=td.parentElement,tbody=tr.parentElement;
    const r=Array.prototype.indexOf.call(tbody.children,tr);
    const c=Array.prototype.indexOf.call(tr.children,td);
    r1=Math.min(r1,r);r2=Math.max(r2,r);c1=Math.min(c1,c);c2=Math.max(c2,c);
  });
  return {r1,r2,c1,c2};
}
function gridSetValue(cellInput,val){
  if(cellInput.tagName==='SELECT'){
    const opt=Array.from(cellInput.options).find(o=>o.value===val||o.textContent.trim()===val);
    if(!opt)return false;
    cellInput.value=opt.value;
  }else{
    cellInput.value=val;
  }
  cellInput.dispatchEvent(new Event('change',{bubbles:true}));
  return true;
}
function gridGetValue(cellInput){return cellInput.value}
document.addEventListener('mousedown',e=>{
  const el=e.target.closest && e.target.closest('.cell-input');
  if(!el)return;
  const info=gridInfo(el);if(!info)return;
  gridDown=true;gridAnchor={table:info.table,r:info.r,c:info.c};gridFocusCell={r:info.r,c:info.c};
  gridHighlight(info.table,info.r,info.c,info.r,info.c);
});
document.addEventListener('mouseover',e=>{
  const el=e.target.closest && e.target.closest('.cell-input');
  if(!el)return;
  const info=gridInfo(el);if(!info)return;
  if(gridDown && gridAnchor && info.table===gridAnchor.table){
    gridFocusCell={r:info.r,c:info.c};
    gridHighlight(gridAnchor.table,gridAnchor.r,gridAnchor.c,info.r,info.c);
  }else if(gridFillDragging && gridFillFrom && info.table===gridFillFrom.table){
    gridFocusCell={r:info.r,c:info.c};
    gridHighlight(gridFillFrom.table,gridFillFrom.r1,gridFillFrom.c1,Math.max(info.r,gridFillFrom.r2),gridFillFrom.c2);
  }
});
document.addEventListener('mouseup',()=>{
  if(gridFillDragging){
    const from=gridFillFrom;
    gridFillDragging=false;gridFillFrom=null;
    if(from && gridFocusCell && gridFocusCell.r>from.r2){
      const srcHeight=from.r2-from.r1+1;
      for(let c=from.c1;c<=from.c2;c++){
        const values=[];
        for(let r=from.r1;r<=from.r2;r++){const ci=gridCellInputAt(from.table,r,c);values.push(ci?gridGetValue(ci):'')}
        let idx=0;
        for(let r=from.r2+1;r<=gridFocusCell.r;r++){
          const ci=gridCellInputAt(from.table,r,c);
          if(ci)gridSetValue(ci,values[idx%srcHeight]);
          idx++;
        }
      }
      gridHighlight(from.table,from.r1,from.c1,gridFocusCell.r,from.c2);
    }
  }
  gridDown=false;
});
document.addEventListener('keydown',e=>{
  const active=document.activeElement;
  if(!active||!active.classList||!active.classList.contains('cell-input'))return;
  const info=gridInfo(active);if(!info)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){
    const sel=gridSelectionOf(info.table);
    if(sel && (sel.r2>sel.r1||sel.c2>sel.c1)){
      e.preventDefault();
      const lines=[];
      for(let r=sel.r1;r<=sel.r2;r++){
        const cols=[];
        for(let c=sel.c1;c<=sel.c2;c++){const ci=gridCellInputAt(info.table,r,c);cols.push(ci?gridGetValue(ci):'')}
        lines.push(cols.join('\t'));
      }
      navigator.clipboard?.writeText(lines.join('\n')).catch(()=>{});
    }
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){
    if(!navigator.clipboard?.readText)return;
    e.preventDefault();
    navigator.clipboard.readText().then(text=>{
      if(!text)return;
      const rows=text.replace(/\r/g,'').split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
      const grid=rows.map(l=>l.split('\t'));
      if(!grid.length)return;
      const sel=gridSelectionOf(info.table);
      const startR=sel?sel.r1:info.r, startC=sel?sel.c1:info.c;
      const endR=sel&&(sel.r2>sel.r1)?sel.r2:startR+grid.length-1;
      const endC=sel&&(sel.c2>sel.c1)?sel.c2:startC+(grid[0]?grid[0].length-1:0);
      for(let r=startR;r<=endR;r++){
        for(let c=startC;c<=endC;c++){
          const ci=gridCellInputAt(info.table,r,c);if(!ci)continue;
          const val=grid[(r-startR)%grid.length][(c-startC)%(grid[0]?grid[0].length:1)]??'';
          gridSetValue(ci,val);
        }
      }
      gridHighlight(info.table,startR,startC,endR,endC);
    }).catch(()=>{});
    return;
  }
  if(e.shiftKey && ['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    if(!gridFocusCell || !gridAnchor || gridAnchor.table!==info.table){gridAnchor={table:info.table,r:info.r,c:info.c};gridFocusCell={r:info.r,c:info.c}}
    let{r,c}=gridFocusCell;
    if(e.key==='ArrowDown')r++;if(e.key==='ArrowUp')r--;if(e.key==='ArrowRight')c++;if(e.key==='ArrowLeft')c--;
    r=Math.max(0,r);c=Math.max(0,c);
    gridFocusCell={r,c};
    gridHighlight(info.table,gridAnchor.r,gridAnchor.c,r,c);
  }
});
document.addEventListener('click',e=>{
  if(!e.target.closest || !e.target.closest('.cell-input, .fill-handle')){
    document.querySelectorAll('table').forEach(gridClear);
    gridAnchor=null;gridFocusCell=null;
  }
});

function closeExcelFilter(){const old=document.getElementById('excelFilterPopup');if(old)old.remove();excelFilterContext=null} window.closeExcelFilter=closeExcelFilter;

  <div class="excel-actions"><button class="excel-clear" onclick="excelClear()">Limpar filtro</button><button class="excel-ok" onclick="excelApply()">OK</button></div>`;
  document.body.appendChild(p);const r=ev.currentTarget.getBoundingClientRect(),w=240;let left=Math.min(r.left,window.innerWidth-w-10);left=Math.max(10,left);let top=r.bottom+5;if(top+330>window.innerHeight)top=Math.max(10,r.top-330);p.style.left=left+'px';p.style.top=top+'px';
} window.openExcelFilter=openExcelFilter;
function excelToggleValue(i,on){if(!excelFilterContext)return;const v=excelFilterContext.values[i];on?excelFilterContext.selected.add(v):excelFilterContext.selected.delete(v);const all=$('#excelAll');if(all)all.checked=excelFilterContext.selected.size===excelFilterContext.values.length} window.excelToggleValue=excelToggleValue;
function excelSelectAll(on){if(!excelFilterContext)return;excelFilterContext.selected=on?new Set(excelFilterContext.values):new Set();$$('#excelFilterPopup .excel-value input').forEach(x=>x.checked=on)} window.excelSelectAll=excelSelectAll;
function excelSearch(q){q=norm(q).toLowerCase();$$('#excelFilterPopup .excel-value').forEach(x=>x.classList.toggle('hidden',q&&!norm(x.dataset.search).toLowerCase().includes(q)))} window.excelSearch=excelSearch;
function excelSearchEnter(e){

    // Limpar o campo agora remove de UMA VEZ todas as linhas vazias (sem qtd/resultado/retorno/2º
    // acasalamento) dessa matriz na estação — antes só tirava a IATF mais alta, então se ela tinha
    // várias linhas vazias por engano (ex: 3, 5, 22) você tinha que limpar uma de cada vez até sobrar
    // só a de verdade. Linha com QUALQUER dado preenchido nunca é apagada aqui, sempre fica intacta.
    const todas=db.iatf.filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd));
    const vazias=todas.filter(r=>!Number(r.qty)&&!normResult(r.result)&&!String(r.return||'').trim()&&!String(r.secondSire||'').trim());
    if(!vazias.length){el.value=matrizCurrentCycle(a.rgd);return}
    const ciclos=vazias.map(r=>Number(r.cycle)).sort((x,y)=>x-y).join(', ');
    if(!confirm(`Remover ${a.rgd} da(s) IATF ${ciclos} (vazia(s), sem nenhum dado lançado)? Lançamentos com dados preenchidos não são mexidos.`)){el.value=matrizCurrentCycle(a.rgd);return}
    const idsVazias=new Set(vazias.map(r=>r.id));
    db.iatf=db.iatf.filter(r=>!idsVazias.has(r.id));
    save();
    el.value=matrizCurrentCycle(a.rgd);
    return;
  }
  const atual=matrizCurrentCycle(a.rgd);
  const cy=Number(val);
  if(!Number.isFinite(cy)||cy<1||!Number.isInteger(cy)){alert('Informe um número de IATF válido (1, 2, 3...).');el.value=atual;return}
  // Antes de criar a nova, some sozinho com qualquer linha VAZIA que essa matriz tenha em OUTRO
  // ciclo (ex: digitou 22 sem querer, queria 2 — a 22 fica vazia, "presa" e o campo não saía dela).
  // Isso resolve numa edição só. Linha com QUALQUER dado preenchido nunca é tocada aqui.
  const outrasVazias=db.iatf.filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd)&&Number(r.cycle)!==cy&&!Number(r.qty)&&!normResult(r.result)&&!String(r.return||'').trim()&&!String(r.secondSire||'').trim());
  if(outrasVazias.length){
    const idsVazias=new Set(outrasVazias.map(r=>r.id));
    db.iatf=db.iatf.filter(r=>!idsVazias.has(r.id));
  }
  if(!seasonRows().some(r=>r.rgd===a.rgd&&Number(r.cycle)===cy)){
    db.iatf.push({id:uid('i'),seasonId:a.seasonId,category:a.category,cycle:cy,rgd:a.rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});
    save();
  }
  const depois=matrizCurrentCycle(a.rgd);
  if(Number(depois)!==cy){
    // Ainda sobrou uma IATF maior com dado de verdade — não dá pra apagar sozinho, avisa por quê.
    alert(`Criei a ${cy}ª IATF pra ${a.rgd}, mas o campo continua mostrando ${depois}ª porque essa já tem dado lançado (qtd/resultado/retorno) e não posso apagar sozinho. Se for engano, vá na aba IATF, ciclo ${depois}, e exclua a linha de lá.`);
  }
  el.value=depois;
} window.setAnimalIatfCycle=setAnimalIatfCycle;

// Edição direta na tabela de matrizes, espelhando no IATF (mesma estação, comparação tolerante a maiúsculas/espaços)
function editAnimalCell(id,key,val,el){
  const a=db.animals.find(x=>x.id===id);if(!a)return;
  val=String(val||'').trim();
  if(key==='rgd'){
    const old=a.rgd;
    if(!val){alert('O RGD não pode ficar vazio.');el.value=old;return}
    if(seasonAnimals(a.seasonId).some(x=>x.id!==id&&norm(x.rgd)===norm(val))){alert('Já existe uma matriz com esse RGD nesta estação.');el.value=old;return}
    a.rgd=val;
    db.iatf.forEach(r=>{if(r.seasonId===a.seasonId&&norm(r.rgd)===norm(old))r.rgd=val});
  }else if(key==='firstSire'){
    if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque. Cadastre em Estoque primeiro.`);el.value=el.dataset.prev||'';return}
    a.firstSire=val;
    // espelha em TODAS as IATFs dessa matriz, na mesma estação
    db.iatf.forEach(r=>{if(r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd))r.firstSire=val});
  }else if(key==='category'){
    a.category=val;
    db.iatf.forEach(r=>{if(r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd))r.category=val});
    if(el){el.classList.remove('cat-vacas','cat-primi','cat-preco');el.classList.add(catClass(val));}
  }else if(key==='createdAt'){
    a.createdAt=val; // pode deixar vazio também, sem problema
  }
  el.dataset.prev=val;
  // Não recria a tabela a cada edição: mantém foco e rolagem exatamente onde estão.
  save();
} window.editAnimalCell=editAnimalCell;

/* IATF */
function getIatfCycleCategories(cycle=iatfCycle){
  const sid=db?.meta?.activeSeasonId;if(!sid)return [];
  db.iatfCycleCategories=db.iatfCycleCategories||{};
  db.iatfCycleCategories[sid]=db.iatfCycleCategories[sid]||{};
  return db.iatfCycleCategories[sid][String(Number(cycle))]||[];
}
function setIatfCycleCategories(cycle,cats){
  const sid=db.meta.activeSeasonId;
  db.iatfCycleCategories=db.iatfCycleCategories||{};
  db.iatfCycleCategories[sid]=db.iatfCycleCategories[sid]||{};
  db.iatfCycleCategories[sid][String(Number(cycle))]=[...new Set(cats)];
}
function iatfRowsFiltered(){
  // As caixinhas de categoria só controlam a montagem automática em massa (ver toggleIatfCategory).
  // A tabela sempre mostra TUDO que já está nesta IATF, categoria marcada ou não — inclusive uma
  // matriz que você colocou manualmente pela coluna "IATF atual" em Matrizes.
  let rows=seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)).filter(r=>excelPass('iatf',r));
  const k=iatfSort.key,d=iatfSort.dir;if(k)rows.sort((a,b)=>String(a[k]??'').localeCompare(String(b[k]??''),'pt-BR',{numeric:true})*d);return rows
}
function sortIatf(k){if(iatfSort.key===k)iatfSort.dir*=-1;else iatfSort={key:k,dir:1};renderIatfRows()} window.sortIatf=sortIatf;
function iff(k,v){iatfFilters[k]=v;renderIatfRows()} window.iff=iff;
function eligibleForIatf(a,cycle){
  if(!a||!a.rgd)return false;
  // Não "volta no tempo": se ela já tem QUALQUER lançamento nesta IATF ou numa IATF à frente
  // (ex: ela já está na 10ª), não entra aqui — é isso que fazia ela aparecer em várias IATFs
  // de uma vez quando as categorias eram marcadas fora de ordem.
  const jaAdiante=seasonRows().some(r=>r.rgd===a.rgd&&Number(r.cycle)>=Number(cycle));
  if(jaAdiante)return false;
  // Para a categoria escolhida: quem nunca entrou antes aparece; quem já entrou volta se
  // o último diagnóstico anterior for V ou se ainda estiver sem resultado.
  const previous=seasonRows().filter(r=>r.rgd===a.rgd&&Number(r.cycle)<Number(cycle)).sort((x,y)=>Number(y.cycle)-Number(x.cycle));
  if(!previous.length)return true;
  const latest=previous[0];
  const res=normResult(latest.result);
  return !res || res==='V';
}
function isIatfExcluded(rgd,cycle=iatfCycle){
  const sid=db?.meta?.activeSeasonId;
  return (db.iatfExcluded||[]).some(x=>x.seasonId===sid&&Number(x.cycle)===Number(cycle)&&x.rgd===rgd);
}
function prepareIatfCategories(){
  const cats=getIatfCycleCategories(iatfCycle);if(!cats.length)return;
  const existing=new Set(seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)).map(r=>r.rgd));
  let changed=false;
  cats.forEach(cat=>{
    seasonAnimals().filter(a=>a.category===cat&&eligibleForIatf(a,iatfCycle)).forEach(a=>{
      if(existing.has(a.rgd)||isIatfExcluded(a.rgd,iatfCycle))return;
      db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:a.category,cycle:iatfCycle,rgd:a.rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});
      existing.add(a.rgd);changed=true;
    });
  });
  if(changed)save();
}
function toggleIatfCategory(cat,checked){
  let cats=getIatfCycleCategories(iatfCycle).slice();
  if(checked){if(!cats.includes(cat))cats.push(cat)}
  else{
    cats=cats.filter(c=>c!==cat);
    // Ao desmarcar, apaga somente linhas automáticas ainda totalmente vazias.
    db.iatf=db.iatf.filter(r=>!(r.seasonId===db.meta.activeSeasonId&&Number(r.cycle)===Number(iatfCycle)&&r.category===cat&&!Number(r.qty)&&!normResult(r.result)&&!String(r.return||'').trim()&&!String(r.secondSire||'').trim()));
  }
  setIatfCycleCategories(iatfCycle,cats);
  if(checked)prepareIatfCategories();else save();
  renderIatfRows();
} window.toggleIatfCategory=toggleIatfCategory;

  <td><input class="cell-input nav-result iatf-result" list="resultList" maxlength="3" data-id="${r.id}" value="${esc(r.result||'')}" oninput="this.value=this.value.toUpperCase()" onkeydown="iatfEnter(event,'nav-result')" onchange="updateIatfResult('${r.id}',this.value,this)"></td>

function iatfEnter(e,cls){if(e.key!=='Enter')return;e.preventDefault();e.target.blur();const els=$$('.'+cls);const i=els.indexOf(e.target);if(els[i+1]){els[i+1].focus();if(typeof els[i+1].select==='function')els[i+1].select()}} window.iatfEnter=iatfEnter;
function updateIatfCell(id,key,val){const r=db.iatf.find(x=>x.id===id);if(!r)return;r[key]=key==='qty'?Number(String(val).replace(',','.'))||0:val;save()} window.updateIatfCell=updateIatfCell;
function updateIatfSire(el){
  const val=el.value.trim();
  if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque.`);el.value=el.dataset.prev||'';return}
  const r=db.iatf.find(x=>x.id===el.dataset.id);
  if(r){
    r.firstSire=val;
    // espelha na aba Matrizes e nas demais IATFs da mesma matriz, na mesma estação
    const a=db.animals.find(x=>x.seasonId===r.seasonId&&norm(x.rgd)===norm(r.rgd)); if(a)a.firstSire=val;
    db.iatf.forEach(x=>{if(x.seasonId===r.seasonId&&norm(x.rgd)===norm(r.rgd))x.firstSire=val});
    save();el.dataset.prev=val
  }
} window.updateIatfSire=updateIatfSire;
function ensureNextIatf(r){
  const next=Number(r.cycle)+1;
  if(!seasonRows().some(x=>x.rgd===r.rgd&&Number(x.cycle)===next)){
    db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:r.category,cycle:next,rgd:r.rgd,firstSire:r.firstSire,secondSire:'',qty:0,result:'',return:''})
  }
}
// Remove os ciclos seguintes dessa matriz que ainda estão vazios (sem qtd/resultado/retorno)
function removeEmptyFollowUps(r){
  db.iatf=db.iatf.filter(x=>!(x.seasonId===r.seasonId&&x.rgd===r.rgd&&Number(x.cycle)>Number(r.cycle)&&!normResult(x.result)&&!Number(x.qty)&&!String(x.return||'').trim()&&!String(x.secondSire||'').trim()))
}
function updateIatfResult(id,val,el){
  val=normResult(val);
  if(el.value.trim() && !val){alert('Resultado deve ser P, V ou PRT.');el.value='';return}
  const r=db.iatf.find(x=>x.id===id);if(!r)return;
  r.result=val; el.value=val;
  // Na nova lógica, nenhuma matriz é lançada automaticamente na próxima IATF.
  const before=db.iatf.length;
  if(val!=='V')removeEmptyFollowUps(r);
  save();
  // Só reconstrói a tabela inteira se alguma linha realmente sumiu — do contrário isso quebrava
  // o foco no meio da digitação (você apertava Enter e "voltava" pra célula errada).
  if(db.iatf.length!==before){
    // Se tiver outra célula com edição em andamento (ainda focada, valor ainda não confirmado),
    // força ela a confirmar ANTES de reconstruir a tabela — assim nada digitado se perde.
    if(document.activeElement && document.activeElement!==el && typeof document.activeElement.blur==='function')document.activeElement.blur();
    renderIatfRows();
  }
} window.updateIatfResult=updateIatfResult;

/* IMPORTAÇÃO — Acasalamentos e Não Utilizadas (respeita a estação ativa) */
function importAcasalExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD'])||'').trim();
      if(!rgd)return;
      const cat=String(pick(r,['CATEGORIA'])||'').trim();
      if(cat && !['Vacas','Primíparas','Precocinha'].includes(cat)){errs.push(`Linha ${line}: categoria "${cat}" inválida.`);return}
      const vals={};
      ACASAL_COLS.forEach(([k,label])=>{
        const key=label.replace(/[ºª]/g,'').trim().replace(' ','_').toUpperCase(); // ex: "1º IATF" -> "1_IATF"
        const v=String(pick(r,[key,label])||'').trim();
        if(v && !sireExists(v)){errs.push(`Linha ${line}: touro "${v}" (${label}) não existe no Estoque.`);return}
        vals[k]=v;
      });
      prepared.push({rgd,cat,...vals});
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nada foi importado.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    let novos=0,atualizados=0;
    db.acasalamentos=db.acasalamentos||[];
    prepared.forEach(x=>{
      const existing=db.acasalamentos.find(a=>a.seasonId===db.meta.activeSeasonId&&norm(a.rgd)===norm(x.rgd));
      if(existing){
        if(x.cat)existing.category=x.cat;
        ACASAL_COLS.forEach(([k])=>{if(x[k])existing[k]=x[k]});
        atualizados++;
      }else{
        const novo={id:uid('ac'),seasonId:db.meta.activeSeasonId,rgd:x.rgd,category:x.cat||'',createdAt:todayISO()};
        ACASAL_COLS.forEach(([k])=>{novo[k]=x[k]||''});
        db.acasalamentos.push(novo);
        novos++;
      }
    });
    save();
    alert(`${novos} linha(s) nova(s) e ${atualizados} atualizada(s) em Acasalamentos.`);
    if(page==='acasal')acasalPage();
  })
} window.importAcasalExcel=importAcasalExcel;
function importNaoUtilizadasExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD'])||'').trim();
      if(!rgd)return;
      const cat=String(pick(r,['CATEGORIA'])||'').trim();
      if(cat && !['Vacas','Primíparas','Precocinha'].includes(cat)){errs.push(`Linha ${line}: categoria "${cat}" inválida.`);return}
      const dest=String(pick(r,['DESTINACAO','DESTINAÇÃO'])||'').trim();
      if(dest && !['Abate','Receptora'].includes(dest)){errs.push(`Linha ${line}: destinação "${dest}" inválida (use Abate ou Receptora).`);return}
      const motivo=String(pick(r,['MOTIVO'])||'').trim();
      prepared.push({rgd,cat,dest,motivo});
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nada foi importado.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    db.naoUtilizadas=db.naoUtilizadas||[];
    let novos=0,atualizados=0;
    prepared.forEach(x=>{
      const existing=db.naoUtilizadas.find(a=>a.seasonId===db.meta.activeSeasonId&&norm(a.rgd)===norm(x.rgd));
      if(existing){
        if(x.cat)existing.category=x.cat;
        if(x.dest)existing.destino=x.dest;
        if(x.motivo)existing.motivo=x.motivo;
        atualizados++;
      }else{
        db.naoUtilizadas.push({id:uid('nu'),seasonId:db.meta.activeSeasonId,rgd:x.rgd,category:x.cat||'',destino:x.dest||'',motivo:x.motivo||'',createdAt:todayISO()});
        novos++;
      }
    });
    save();
    alert(`${novos} linha(s) nova(s) e ${atualizados} atualizada(s) em Não Utilizadas.`);
    renderNaoUtilizadasModal();
  })
} window.importNaoUtilizadasExcel=importNaoUtilizadasExcel;

/* EMBRIÕES — Estoque / Saída Fazenda / Usados, cada um com Fresco/VIT/DT. GLOBAL (não pertence a
   nenhuma estação — é estoque de verdade, junto com o Estoque de Sêmen, e continua entre estações).
   Uma linha por RGD Doadora + Touro (uma doadora pode ter várias linhas, uma pra cada touro usado). */
function embUsados(rgd, touro, tipo){
  return (db.fiv||[]).filter(f=>norm(f.rgdDoadora)===norm(rgd) && norm(f.sire||'')===norm(touro||'') && f.tipo===tipo).length;
}
function embRowCalc(e){
  const estTotal=(Number(e.estFresco)||0)+(Number(e.estVit)||0)+(Number(e.estDt)||0);
  const saidaTotal=(Number(e.saidaFresco)||0)+(Number(e.saidaVit)||0)+(Number(e.saidaDt)||0);
  const usoFresco=embUsados(e.rgd,e.touro,'Fresco'),usoVit=embUsados(e.rgd,e.touro,'VIT'),usoDt=embUsados(e.rgd,e.touro,'DT');
  const usoTotal=usoFresco+usoVit+usoDt;
  // Estoque + Saída − Usados: às vezes o embrião vai direto do estoque central pra vaca, sem
  // passar por "saída fazenda" antes — então o saldo tem que considerar os dois potes juntos.
  const saldoTotal=estTotal+saidaTotal-usoTotal;
  return {estTotal,saidaTotal,usoFresco,usoVit,usoDt,usoTotal,saldoTotal};
}
function embrioesRowsFiltered(){
  let rows=(db.embrioes||[]).map(e=>({...e,...embRowCalc(e)})).filter(e=>excelPass('embrioes',e));
  const k=embrioesSort.key,d=embrioesSort.dir;
  if(k)rows.sort((a,b)=>{
    const av=a[k],bv=b[k];
    if(typeof av==='number'||typeof bv==='number')return ((Number(av)||0)-(Number(bv)||0))*d;
    return String(av??'').localeCompare(String(bv??''),'pt-BR',{numeric:true})*d;
  });
  return rows;
}

function editEmbriao(id,key,val,el){
  const e=(db.embrioes||[]).find(x=>x.id===id);if(!e)return;
  if(key==='rgd'){e.rgd=String(val||'').trim();save();return}
  if(key==='touro'){
    val=String(val||'').trim();
    if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque. Cadastre em Estoque primeiro.`);el.value=e.touro||'';return}
    e.touro=val;save();return
  }
  const n=Number(String(val).replace(',','.'));
  e[key]=Number.isFinite(n)?Math.max(0,n):0;
  save();
  const tr=el.closest('tr');if(!tr)return;
  const calc=embRowCalc(e);
  const ce=tr.querySelector('.cell-est-total');if(ce)ce.textContent=calc.estTotal;
  const cs=tr.querySelector('.cell-saida-total');if(cs)cs.textContent=calc.saidaTotal;
  const csa=tr.querySelector('.cell-saldo-total');
  if(csa){csa.textContent=calc.saldoTotal;csa.style.color=calc.saldoTotal<0?'#a84d2b':'#245f40'}
  const tfoot=tr.closest('table')?.querySelector('tfoot');
  if(tfoot)tfoot.outerHTML=embrioesTotalsRowHTML(embrioesRowsFiltered());
} window.editEmbriao=editEmbriao;

function importEmbrioesExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD'])||'').trim();
      if(!rgd)return;
      const touro=String(pick(r,['TOURO'])||'').trim();
      if(touro && !sireExists(touro)){errs.push(`Linha ${line}: touro "${touro}" não existe no Estoque.`);return}
      const num=(names)=>{const v=pick(r,names);if(v===''||v===undefined||v===null)return 0;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0){errs.push(`Linha ${line}: valor inválido em ${names[0]}.`);return 0}return n};
      prepared.push({
        rgd,touro,
        estFresco:num(['ESTOQUE_FRESCO','FRESCO']),
        estVit:num(['ESTOQUE_VIT','VIT']),
        estDt:num(['ESTOQUE_DT','DT']),
        saidaFresco:num(['SAIDA_FRESCO']),
        saidaVit:num(['SAIDA_VIT']),
        saidaDt:num(['SAIDA_DT'])
      });
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nada foi importado.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    db.embrioes=db.embrioes||[];
    let novos=0,atualizados=0;
    prepared.forEach(x=>{
      // a chave é RGD + Touro (uma doadora pode ter uma linha por touro usado nela)
      const existing=db.embrioes.find(e=>norm(e.rgd)===norm(x.rgd)&&norm(e.touro||'')===norm(x.touro||''));
      if(existing){
        // soma ao que já existe (é assim que o estoque acumula entre sessões/OPUs)
        existing.estFresco=(Number(existing.estFresco)||0)+x.estFresco;
        existing.estVit=(Number(existing.estVit)||0)+x.estVit;
        existing.estDt=(Number(existing.estDt)||0)+x.estDt;
        existing.saidaFresco=(Number(existing.saidaFresco)||0)+x.saidaFresco;
        existing.saidaVit=(Number(existing.saidaVit)||0)+x.saidaVit;
        existing.saidaDt=(Number(existing.saidaDt)||0)+x.saidaDt;
        atualizados++;
      }else{
        db.embrioes.push({id:uid('emb'),rgd:x.rgd,touro:x.touro,estFresco:x.estFresco,estVit:x.estVit,estDt:x.estDt,saidaFresco:x.saidaFresco,saidaVit:x.saidaVit,saidaDt:x.saidaDt});
        novos++;
      }
    });
    save();
    alert(`${novos} doadora(s) nova(s) e ${atualizados} com estoque somado ao que já existia.`);
    if(page==='embrioes')embrioesPage();
  })
} window.importEmbrioesExcel=importEmbrioesExcel;

/* FIV — RGD Doadora puxa da lista já cadastrada em Embriões; Tipo alimenta os Usados de lá. Pertence à estação. */
function embDoadoraDatalist(){
  const list=[...new Set((db.embrioes||[]).map(e=>e.rgd).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
  return `<datalist id="embDoadoraList">${list.map(r=>`<option value="${esc(r)}"></option>`).join('')}</datalist>`;
}
// Touros associados àquele RGD Doadora em Embriões (é daqui que a lista suspensa do 1º
// Acasalamento na FIV puxa — se a doadora só tem uma linha com TUPA, só aparece TUPA; se tiver
// TUPA e ROLEX, aparecem os dois).
function touroOptionsForRgd(rgd){
  return [...new Set((db.embrioes||[]).filter(e=>norm(e.rgd)===norm(rgd)&&String(e.touro||'').trim()).map(e=>e.touro))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function fivRowsFiltered(){
  let rows=seasonFiv().filter(r=>excelPass('fiv',r));

  if(k)rows.sort((a,b)=>String(a[k]??'').localeCompare(String(b[k]??''),'pt-BR',{numeric:true})*d);
  return rows;
}

function editFiv(id,key,val,el){
  const r=(db.fiv||[]).find(x=>x.id===id);if(!r)return;
  val=String(val||'').trim();
  if(key==='sire' && val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque.`);el.value=r.sire||'';return}
  if(key==='resultado'){
    const v=normResult(val);
    if(val && !v){alert('Resultado deve ser P, V ou PRT.');el.value=r.resultado||'';return}
    val=v;
  }
  r[key]=val;
  save();
  if(key==='rgdDoadora'){
    // RGD mudou: atualiza a lista suspensa do touro SÓ dessa linha, sem recarregar a tabela toda
    const dl=document.getElementById('fivSireList-'+id);
    if(dl)dl.innerHTML=touroOptionsForRgd(val).map(t=>`<option value="${esc(t)}"></option>`).join('');
  }
} window.editFiv=editFiv;

  const __view=captureViewPosition();
  const rows=stockRowsFiltered();
  const totalDoses=rows.reduce((a,s)=>a+Number(s.initial||0),0),totalUsado=rows.reduce((a,s)=>a+Number(s.used||0),0),totalSaldo=rows.reduce((a,s)=>a+Number(s.saldo||0),0);
  const fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
  root.innerHTML=`<div style="display:flex;justify-content:flex-end;align-items:center;margin:0 2px 10px;font-size:12px;color:#69746c"><strong style="color:#233129;margin-right:4px">${rows.length}</strong> registros no filtro</div><div class="table-wrap"><table><thead>
  <tr><th>${excelHead('stock','name','Touro')}</th><th>${excelHead('stock','rgdTouro','RGD do touro')}</th><th>${excelHead('stock','tank','Botijão')}</th><th>${excelHead('stock','caneca','Caneca')}</th><th>${excelHead('stock','initial','Qtd doses')}</th><th>${excelHead('stock','used','Usado')}</th><th>${excelHead('stock','saldo','Saldo')}</th><th>${excelHead('stock','addedDate','Data entrada')}</th><th></th></tr>
  </thead><tbody>${rows.map(s=>{
    const auto=usedAuto(s), manual=!(s.usedOverride===null||s.usedOverride===undefined);
    return `<tr>
  <td><input class="cell-input" style="min-width:210px;font-weight:600" value="${esc(s.name)}" data-old="${esc(s.name)}" onchange="editStockCell('${s.id}','name',this.value,this)"></td>
  <td><input class="cell-input" value="${esc(s.rgdTouro||'')}" placeholder="—" onchange="editStockCell('${s.id}','rgdTouro',this.value,this)"></td>
  <td><input class="cell-input" value="${esc(s.tank||'')}" onchange="editStockCell('${s.id}','tank',this.value,this)"></td>
  <td><input class="cell-input" value="${esc(s.caneca||'')}" onchange="editStockCell('${s.id}','caneca',this.value,this)"></td>
  <td><input class="cell-input" inputmode="decimal" value="${Number(s.initial||0)}" onchange="editStockCell('${s.id}','initial',this.value,this)"></td>
  <td style="white-space:nowrap"><input class="cell-input" style="width:62px;min-width:62px;text-align:center;${manual?'font-weight:700;color:#a84d2b':''}" inputmode="decimal" value="${s.used}" title="${manual?'Ajustado manualmente. Automático pelas IATFs seria '+auto:'Calculado automaticamente pelas IATFs'}" onchange="editStockCell('${s.id}','used',this.value,this)">${manual?`<button class="mini" style="padding:2px 5px;margin-left:3px" title="Voltar ao cálculo automático (${auto})" onclick="clearUsedOverride('${s.id}')">↺</button>`:''}</td>
  <td class="${s.saldo<=0?'stock-low':'stock-ok'}"><strong>${s.saldo}</strong></td>
  <td><input class="cell-input" type="date" value="${esc(s.addedDate||'')}" onchange="editStockCell('${s.id}','addedDate',this.value,this)"></td>
  <td><button class="mini" onclick="deleteStock('${s.id}')">Excluir</button></td></tr>`}).join('')}</tbody><tfoot><tr style="background:#f3f6f4;font-weight:800;border-top:2px solid #cfd8d2"><td colspan="4" style="text-align:right">TOTAL</td><td>${fmt(totalDoses)}</td><td>${fmt(totalUsado)}</td><td>${fmt(totalSaldo)}</td><td></td><td></td></tr></tfoot></table></div>`;
  restoreViewPosition(__view);
}

  save();stock();
  setTimeout(()=>{const els=$$('#stockTable .cell-input');const last=els[els.length-9];if(last){last.scrollIntoView({block:'nearest'});last.focus()}},30)

function clearUsedOverride(id){const s=db.semen.find(x=>x.id===id);if(!s)return;s.usedOverride=null;save();renderStock()} window.clearUsedOverride=clearUsedOverride;
function editStockCell(id,key,val,el){
  const s=db.semen.find(x=>x.id===id);if(!s)return;
  if(key==='name'){
    val=val.trim();const old=s.name;
    if(!val){if(old){alert('O nome do touro não pode ficar vazio.');el.value=old}return}
    if(db.semen.some(x=>x.id!==id&&norm(x.name)===norm(val))){alert('Já existe um cadastro com esse nome.');el.value=old;return}
    s.name=val;db.animals.forEach(a=>{if(norm(a.firstSire)===norm(old))a.firstSire=val});db.iatf.forEach(r=>{if(norm(r.firstSire)===norm(old))r.firstSire=val})
  }else if(key==='initial'){s.initial=Number(String(val).replace(',','.'))||0}
  else if(key==='used'){
    const v=String(val).trim();
    if(v===''){s.usedOverride=null}                       // vazio = volta ao automático
    else{
      const n=Number(v.replace(',','.'));
      if(!Number.isFinite(n)||n<0){alert('Informe um número válido em "Usado".');renderStock();return}
      s.usedOverride=(n===usedAuto(s))?null:n;            // igual ao automático = mantém automático
    }
  }
  else s[key]=val;
  save();renderStock()
} window.editStockCell=editStockCell;

function saveStockManual(){

  const existing=db.semen.find(x=>norm(x.name)===norm(name)),q=Number($('#sQty').value||0);

  else db.semen.push({id:uid('s'),name,rgdTouro:$('#sTankName').value.trim(),tank:$('#sTank').value.trim(),caneca:$('#sCaneca').value.trim(),initial:q,addedDate:$('#sDate').value,usedOverride:null,active:true});
  save();closeModal();stock()
} window.saveStockManual=saveStockManual;
function deleteStock(id){const s=db.semen.find(x=>x.id===id);if(!s)return;if(db.animals.some(a=>norm(a.firstSire)===norm(s.name))||db.iatf.some(r=>norm(r.firstSire)===norm(s.name)))return alert('Esse touro está sendo usado em Matrizes/IATF e não pode ser excluído. Edite o nome ou mantenha saldo zero.');if(!confirm('Excluir este cadastro de sêmen?'))return;db.semen=db.semen.filter(x=>x.id!==id);save();renderStock()} window.deleteStock=deleteStock;

/* BACKUP COMPLETO / RESTAURAÇÃO */
function downloadFullBackup(){
  const payload={
    exportedAt:new Date().toISOString(),
    exportedFrom:'IATF MRA - backup manual',
    db:deepClone(db)
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().slice(0,10);
  const a=document.createElement('a');a.href=url;a.download=`backup_iatf_${stamp}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{localStorage.setItem('iatf-last-backup-at',new Date().toISOString())}catch(e){}
  if(page==='settings')settings();
} window.downloadFullBackup=downloadFullBackup;
function restoreFullBackup(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(fr.result)}catch(e){alert('Esse arquivo não é um backup válido (JSON inválido).');return}
    const raw=parsed&&parsed.db?parsed.db:parsed;
    if(!raw||!Array.isArray(raw.animals)||!Array.isArray(raw.seasons)){alert('Esse arquivo não parece ser um backup do IATF MRA.');return}
    const nSeasons=raw.seasons.length,nAnimals=raw.animals.length,nIatf=(raw.iatf||[]).length,nSemen=(raw.semen||[]).length;
    const dataInfo=parsed.exportedAt?new Date(parsed.exportedAt).toLocaleString('pt-BR'):'(data desconhecida)';
    openModal(`<h2>⚠️ Restaurar backup</h2>
    <div class="notice">Este backup foi baixado em <strong>${esc(dataInfo)}</strong> e contém:<br>
    • ${nSeasons} estação(ões)<br>• ${nAnimals} matriz(es) no total (todas as estações)<br>• ${nIatf} lançamento(s) de IATF<br>• ${nSemen} cadastro(s) de sêmen</div>
    <div class="notice" style="background:#fde7e5;border-color:#f1c9c1;color:#7a2318"><strong>Isso vai SUBSTITUIR TUDO que está no sistema agora</strong> (Firestore incluído, em todos os dispositivos conectados). Tudo que foi feito depois da data deste backup será perdido. Essa ação não tem desfazer.</div>
    <div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="danger-btn" onclick="confirmRestoreBackup()">Sim, restaurar mesmo assim</button></div>`);
    window.__pendingRestore=raw;
  };
  fr.readAsText(file);
} window.restoreFullBackup=restoreFullBackup;
function confirmRestoreBackup(){
  const raw=window.__pendingRestore;if(!raw)return;
  db=migrate(deepClone(raw));
  window.__pendingRestore=null;
  resetUndoBaseline(true);
  try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}
  closeModal();
  localWritePending=true;
  setSyncStatus('saving','Restaurando backup...');
  syncToFirestore();
  render();
  alert('Backup restaurado. Confira os dados.');
} window.confirmRestoreBackup=confirmRestoreBackup;
function modalSeason(id=''){const s=id?db.seasons.find(x=>x.id===id):null;openModal(`<h2>${s?'Editar':'Nova'} estação</h2><div class="form-grid"><div class="field full"><label>Nome</label><input id="seName" class="input" value="${esc(s?.name||'')}"></div><div class="field"><label>Data inicial</label><input id="seStart" type="date" class="input" value="${esc(s?.startDate||'')}"></div><div class="field"><label>Data final</label><input id="seEnd" type="date" class="input" value="${esc(s?.endDate||'')}"></div>${s?'':`<div class="field full"><label>Cadastro de matrizes da nova estação</label><select id="seWipe"><option value="copiar" selected>Copiar as matrizes da estação atual (${esc(activeSeason().name)})</option><option value="vazia">Começar vazia (vou subir a lista nova)</option></select><div class="help">Não apaga nada da estação atual — as matrizes de cada estação ficam separadas.</div></div>`}</div>
  <div class="notice">A nova estação começa <strong>sem</strong> lançamentos de IATF, Acasalamentos, Não Utilizadas nem FIV — tudo isso fica guardado na estação anterior, do jeito que estava. O <strong>Estoque de Sêmen e os Embriões</strong> são sempre mantidos e compartilhados entre estações (não são "por estação").</div><div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveSeason('${id}')">Salvar</button></div>`)} window.modalSeason=modalSeason;
function saveSeason(id){
  const name=$('#seName').value.trim();if(!name)return alert('Informe o nome.');
  const obj={name,startDate:$('#seStart').value,endDate:$('#seEnd').value,active:true};
  if(id){Object.assign(db.seasons.find(x=>x.id===id),obj)}
  else{
    const copiar=($('#seWipe')||{value:'copiar'}).value==='copiar';
    const oldSid=db.meta.activeSeasonId;
    const n={id:uid('season'),...obj};
    db.seasons.push(n);db.meta.activeSeasonId=n.id;db.cycleDates[n.id]={};
    // Nunca apaga nada da estação anterior. "Copiar" duplica o rebanho atual para a nova estação;
    // "Começar vazia" simplesmente não copia nada — a estação antiga fica intacta do mesmo jeito.
    // Acasalamentos, Não Utilizadas e FIV NUNCA são copiados — a estação nova sempre começa vazia
    // neles (mas o que já existia na estação anterior continua lá, intocado).
    if(copiar){
      seasonAnimals(oldSid).forEach(a=>db.animals.push({...deepClone(a),id:uid('a'),seasonId:n.id}));
    }
  }
  save();closeModal();settings();renderSeasonSelector()
} window.saveSeason=saveSeason;
function activateSeason(id){db.meta.activeSeasonId=id;save();render()} window.activateSeason=activateSeason;
function deleteSeason(id){
  const s=db.seasons.find(x=>x.id===id);if(!s)return;
  if(db.seasons.length<=1)return alert('Não é possível excluir a única estação cadastrada.');
  const n=db.iatf.filter(r=>r.seasonId===id).length;
  if(!confirm(`ATENÇÃO: excluir a estação "${s.name}"?\n\nIsso apaga ${n} lançamento(s) de IATF dessa estação. As matrizes cadastradas nela, os acasalamentos/FIV dela e o estoque de sêmen/embriões NÃO são apagados (ficam guardados, mas sem uma estação ativa vinculada).`))return;
  if(!confirm(`Confirme mais uma vez.\n\nEsta ação NÃO pode ser desfeita. Excluir definitivamente "${s.name}"?`))return;
  db.seasons=db.seasons.filter(x=>x.id!==id);
  db.iatf=db.iatf.filter(r=>r.seasonId!==id);
  if(db.cycleDates)delete db.cycleDates[id];
  if(db.meta.activeSeasonId===id)db.meta.activeSeasonId=db.seasons[0].id;
  save();settings();renderSeasonSelector();
  alert(`Estação "${s.name}" excluída.`)
} window.deleteSeason=deleteSeason;

/* Exportar estação completa (todas as abas num Excel só) */
function exportSeasonAll(){
  if(!needXLSX())return;
  const est=activeSeason();
  const wb=XLSX.utils.book_new();
  const iatfRows=seasonRows().slice().sort((a,b)=>Number(a.cycle)-Number(b.cycle)||String(a.category).localeCompare(b.category)||String(a.rgd).localeCompare(b.rgd,'pt-BR',{numeric:true}))
    .map(r=>({IATF:Number(r.cycle),DATA_IATF:cycleDate(r.cycle),RGD:r.rgd,'1_ACASALAMENTO':r.firstSire,'2_ACASALAMENTO_CURRAL':r.secondSire||'',QTD:r.qty,RESULTADO:r.result,RETORNO:r.return||'',CATEGORIA:r.category}));
  const matRows=seasonAnimals().slice().sort((a,b)=>String(a.rgd).localeCompare(b.rgd,'pt-BR',{numeric:true}))
    .map(a=>({RGD:a.rgd,'1_ACASALAMENTO':a.firstSire||'',CATEGORIA:a.category,SITUACAO:statusLabel(latestStatus(a.rgd))}));
  const stkRows=db.semen.slice().sort((a,b)=>String(a.name).localeCompare(b.name,'pt-BR',{numeric:true}))
    .map(s=>({TOURO:s.name,RGD_TOURO:s.rgdTouro||'',BOTIJAO:s.tank||'',CANECA:s.caneca||'',QTD_DOSES:Number(s.initial||0),UTILIZADO:usedEffective(s),SALDO:stockBalance(s),DATA_ENTRADA:s.addedDate||''}));
  const resumo=[
    {INDICADOR:'Estação',VALOR:est.name},
    {INDICADOR:'Período',VALOR:`${fmtDate(est.startDate)} a ${fmtDate(est.endDate)}`},
    {INDICADOR:'Matrizes cadastradas',VALOR:seasonAnimals().length},
    {INDICADOR:'Lançamentos de IATF',VALOR:iatfRows.length},
    {INDICADOR:'Prenhas',VALOR:finalOutcomeCounts().P},
    {INDICADOR:'Vazias',VALOR:finalOutcomeCounts().V},
    {INDICADOR:'PRT',VALOR:finalOutcomeCounts().PRT},
    {INDICADOR:'Doses em saldo',VALOR:db.semen.reduce((a,s)=>a+stockBalance(s),0)},
    {INDICADOR:'Gerado em',VALOR:new Date().toLocaleString('pt-BR')},
  ];
  const add=(rows,nome)=>{if(!rows.length)return;const ws=XLSX.utils.json_to_sheet(rows);ws['!autofilter']={ref:ws['!ref']};XLSX.utils.book_append_sheet(wb,ws,nome)};
  add(resumo,'Resumo');add(iatfRows,'IATF');add(matRows,'Matrizes');add(stkRows,'Estoque');
  downloadWorkbook(wb,'estacao_'+est.name.replace(/\W+/g,'_')+'.xlsx')
} window.exportSeasonAll=exportSeasonAll;

/* EXCEL */
function needXLSX(){if(typeof XLSX==='undefined'){alert('A biblioteca do Excel não carregou. Verifique sua internet e abra novamente o arquivo no Chrome/Edge.');return false}return true}
function downloadWorkbook(wb,name){XLSX.writeFile(wb,name)}
async function downloadAnimalTemplate(){
  if(typeof ExcelJS==='undefined'){alert('A biblioteca de Excel avançado não carregou. Verifique sua internet e tente de novo.');return}
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('IMPORTAR');
  ws.columns=[{header:'RGD',key:'rgd',width:20},{header:'1_ACASALAMENTO',key:'sire',width:34},{header:'CATEGORIA',key:'cat',width:18}];
  ws.getRow(1).font={bold:true};
  const bulls=sireNames();
  const cats=['Vacas','Primíparas','Precocinha'];
  const lists=wb.addWorksheet('Listas'); lists.state='hidden';
  bulls.forEach((b,i)=>{lists.getCell(i+1,1).value=b});
  cats.forEach((c,i)=>{lists.getCell(i+1,2).value=c});
  // 1_ACASALAMENTO: lista suspensa de verdade (setinha do Excel), igual a Categoria.
  // Com um clique você escolhe da lista; com o teclado também dá pra digitar o nome direto.
  for(let r=2;r<=501;r++){
    if(bulls.length)ws.getCell(`B${r}`).dataValidation={
      type:'list',allowBlank:true,formulae:[`Listas!$A$1:$A$${bulls.length}`],
      showErrorMessage:true,errorStyle:'stop',errorTitle:'Touro não encontrado',
      error:'Esse touro não está cadastrado no Estoque. Escolha um da lista.'
    };
    ws.getCell(`C${r}`).dataValidation={type:'list',allowBlank:true,formulae:[`Listas!$B$1:$B$${cats.length}`]};
  }
  const inst=wb.addWorksheet('LEIA-ME');
  inst.getColumn(1).width=95;
  [['INSTRUÇÕES'],
   ['RGD é obrigatório. 1_ACASALAMENTO e CATEGORIA são opcionais — pode deixar em branco.'],
   ['1_ACASALAMENTO: clique na célula e use a setinha do lado direito pra escolher o touro (lista vem do seu Estoque). Também dá pra digitar o nome direto.'],
   ['CATEGORIA: mesma coisa — Vacas, Primíparas ou Precocinha pela setinha.'],
   ['Se o RGD já existir nesta estação, os dados desta planilha atualizam o cadastro; se não existir, cria uma matriz nova.'],
   ['Os lançamentos de IATF já existentes para o mesmo RGD, nesta estação, também são atualizados automaticamente.'],
   [''],
   [`Touros disponíveis no Estoque no momento em que este modelo foi gerado: ${bulls.length}.`]
  ].forEach(row=>inst.addRow(row));
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='modelo_matrizes.xlsx';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
} window.downloadAnimalTemplate=downloadAnimalTemplate;

function readExcel(file,cb){if(!file||!needXLSX())return;const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(fr.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}))}catch(e){alert('Não consegui ler o Excel: '+e.message)}};fr.readAsArrayBuffer(file)}
function pick(row,names){const keys=Object.keys(row);for(const n of names){const k=keys.find(k=>norm(k)===norm(n));if(k)return row[k]}return''}
function importAnimalsExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[],seen=new Set();
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD','MATRIZ','MATRIZES'])||Object.values(r)[0]||'').trim();
      if(!rgd)return;
      const sire=String(pick(r,['1_ACASALAMENTO','1 ACASALAMENTO','1º ACASALAMENTO'])||'').trim();
      const cat=String(pick(r,['CATEGORIA'])||'').trim();
      if(sire && !sireExists(sire)){errs.push(`Linha ${line}: touro "${sire}" não existe no Estoque.`);return}
      if(cat && !['Vacas','Primíparas','Precocinha'].includes(cat)){errs.push(`Linha ${line}: categoria "${cat}" inválida.`);return}
      if(seen.has(norm(rgd))){errs.push(`Linha ${line}: RGD "${rgd}" duplicado no arquivo.`);return}
      seen.add(norm(rgd));
      prepared.push({rgd,sire,cat});
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nenhuma matriz foi importada.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    let novos=0,atualizados=0;
    prepared.forEach(x=>{
      const existing=seasonAnimals().find(a=>norm(a.rgd)===norm(x.rgd));
      if(existing){
        if(x.sire)existing.firstSire=x.sire;
        if(x.cat)existing.category=x.cat;
        atualizados++;
      }else{
        db.animals.push({id:uid('a'),seasonId:db.meta.activeSeasonId,rgd:x.rgd,firstSire:x.sire,category:x.cat||'Vacas',active:true,createdAt:todayISO()});
        novos++;
      }
      // sincroniza com lançamentos de IATF já existentes dessa matriz nesta estação
      db.iatf.forEach(r=>{
        if(r.seasonId===db.meta.activeSeasonId && norm(r.rgd)===norm(x.rgd)){
          if(x.sire)r.firstSire=x.sire;
          if(x.cat)r.category=x.cat;
        }
      });
    });
    save();
    alert(`${novos} matriz(es) nova(s) e ${atualizados} atualizada(s) nesta estação.`);
    if(page==='animals')animals()
  })
}
function importStockExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2,name=String(pick(r,['TOURO','CADASTRO_SEMEN','CADASTRO SEMEN','SÊMEN','SEMEN','NOME_BOTIJAO'])).trim(),rgdTouro=String(pick(r,['RGD_TOURO','RGD TOURO','RGD'])).trim(),tank=String(pick(r,['BOTIJAO','BOTIJÃO'])).trim(),caneca=String(pick(r,['CANECA'])).trim(),qRaw=pick(r,['QTD_DOSES','QTD DOSES','QUANTIDADE']),q=Number(String(qRaw).replace(',','.')),date=String(pick(r,['DATA_ENTRADA','DATA ENTRADA'])).trim();
      if(!name&&!rgdTouro&&!tank&&!caneca&&!qRaw&&!date)return;
      if(!name)errs.push(`Linha ${line}: TOURO vazio.`);
      if(!Number.isFinite(q)||q<0)errs.push(`Linha ${line}: QTD_DOSES inválida.`);
      prepared.push({name,rgdTouro,tank,caneca,q,date})
    });
    if(errs.length){showImportErrors('Importação cancelada','Nenhuma entrada de sêmen foi cadastrada.',errs);return}
    prepared.forEach(x=>{const ex=db.semen.find(s=>norm(s.name)===norm(x.name));if(ex){ex.initial=Number(ex.initial||0)+x.q;if(x.rgdTouro)ex.rgdTouro=x.rgdTouro;if(x.tank)ex.tank=x.tank;if(x.caneca)ex.caneca=x.caneca;if(x.date)ex.addedDate=x.date}else db.semen.push({id:uid('s'),name:x.name,rgdTouro:x.rgdTouro,tank:x.tank,caneca:x.caneca,initial:x.q,addedDate:x.date,usedOverride:null,active:true})});
    save();alert(`${prepared.length} linha(s) de estoque importadas.`);if(page==='stock')stock()
  })
}
function showImportErrors(titleText,sub,errs){openModal(`<h2>${esc(titleText)}</h2><div class="notice">${esc(sub)}</div><div class="error-list">${errs.map(e=>`<div>• ${esc(e)}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="closeModal()">Entendi</button></div>`)}

function exportStock(){if(!needXLSX())return;const out=stockRowsFiltered().map(s=>({TOURO:s.name,RGD_TOURO:s.rgdTouro||'',BOTIJAO:s.tank,CANECA:s.caneca,QTD_DOSES:s.initial,UTILIZADO:s.used,SALDO:s.saldo,DATA_ENTRADA:s.addedDate}));jsonToXlsx(out,'estoque_semen.xlsx','Estoque')} window.exportStock=exportStock;

/* AUTENTICAÇÃO FIREBASE */
let appStarted=false;
function authMessage(code){
  const map={
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'Digite um e-mail válido.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente novamente.',
    'auth/network-request-failed':'Sem conexão com a internet.'
  };
  return map[code]||'Não foi possível entrar. Verifique os dados e tente novamente.';
}
async function bootAuth(){
  try{
    if(!window.firebase)throw new Error('SDK do Firebase não carregou.');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const form=document.getElementById('loginForm');
    const btn=document.getElementById('loginButton');
    const err=document.getElementById('loginError');
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      err.textContent='';btn.disabled=true;btn.textContent='Entrando...';
      try{
        await auth.signInWithEmailAndPassword(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
        document.getElementById('loginPassword').value='';
      }catch(ex){err.textContent=authMessage(ex.code)}
      finally{btn.disabled=false;btn.textContent='Entrar'}
    });

    document.getElementById('logoutBtn').addEventListener('click',async()=>{await auth.signOut();location.reload()});

    auth.onAuthStateChanged(user=>{
      if(user){
        document.body.classList.remove('auth-pending','auth-logged-out');
        document.body.classList.add('authenticated');
        if(!appStarted){
          appStarted=true;
          init().catch(e=>{console.error(e);setSyncStatus('error','Problema de conexão')});
        }
      }else{
        if(appStarted){location.reload();return}
        document.body.classList.remove('auth-pending','authenticated');
        document.body.classList.add('auth-logged-out');
        if(unsubscribeFirestore){try{unsubscribeFirestore()}catch(e){} unsubscribeFirestore=null}
        firestore=null;stateRef=null;
      }
    });
  }catch(e){
    console.error('Erro ao iniciar autenticação:',e);
    document.body.classList.remove('auth-pending');
    document.body.classList.add('auth-logged-out');
    const err=document.getElementById('loginError');
    if(err)err.textContent='Não foi possível conectar ao Firebase.';
  }
}
bootAuth();
