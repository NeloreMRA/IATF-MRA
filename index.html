.inline-stat{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0ee;font-size:12px}.inline-stat:last-child{border-bottom:0}
.stock-low{color:#a84d2b;font-weight:700}.stock-ok{color:#245f40}.empty{padding:35px;text-align:center;color:#7b877e}

@media(max-width:600px){.side-season{display:none}}

.checkbox{width:17px;height:17px}.selection-bar{display:flex;align-items:center;gap:8px;background:#fff7e8;border:1px solid #ead7ad;border-radius:9px;padding:8px 10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.out-actions{display:flex;gap:8px;align-items:center;margin-left:auto;padding-left:12px;border-left:1px solid #e1e6e2}

.iatf-category-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #d9dfda;border-radius:8px;padding:6px 9px}.iatf-category-box>span{font-size:11px;font-weight:700;color:#657169;margin-right:2px}.iatf-cat-check{display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;cursor:pointer;font-size:12px;user-select:none}.iatf-cat-check input{margin:0}.iatf-cat-check.vacas{background:#e7f0ff;color:#245a9c}.iatf-cat-check.primi{background:#fff0da;color:#8a5919}.iatf-cat-check.preco{background:#efe8ff;color:#6743a0}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.clickable{cursor:pointer}
.help{font-size:11px;color:#657169;margin-top:4px;line-height:1.4}.error-list{max-height:260px;overflow:auto;background:#fff8f6;border:1px solid #f1c9c1;padding:10px;border-radius:8px;font-size:12px}

/* Filtros estilo Excel */
.excel-filter-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;color:inherit;font:inherit;font-weight:650;text-transform:uppercase;letter-spacing:.03em;padding:0;cursor:pointer;white-space:nowrap;text-align:left}
.excel-filter-btn .filter-arrow{font-size:9px;color:#6f7a72;line-height:1}.excel-filter-btn.active{color:#17613f}.excel-filter-btn.active .filter-arrow{color:#17613f}
.excel-popup{position:fixed;z-index:2000;width:240px;max-width:calc(100vw - 20px);background:#fff;border:1px solid #d7ddd8;border-radius:10px;box-shadow:0 10px 30px #0002;padding:10px;color:#26332b;font-size:12px}
.excel-sort-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.excel-sort-row button{border:1px solid #d9dfda;background:#f8f9f7;border-radius:7px;padding:7px;cursor:pointer}.excel-sort-row button:hover{background:#eef3ef}
.excel-search{width:100%;border:1px solid #d7ddd8;border-radius:7px;padding:7px 9px;margin-bottom:8px;font:inherit}
.excel-check-all{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid #e8ece9}.excel-values{max-height:190px;overflow:auto;margin:5px 0}.excel-value{display:flex;gap:8px;align-items:center;padding:5px 2px}.excel-value.hidden{display:none}.excel-value span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.excel-actions{display:flex;justify-content:flex-end;gap:7px;border-top:1px solid #e8ece9;padding-top:9px}.excel-actions button{border:1px solid #d6ddd7;background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer}.excel-actions .excel-ok{border-color:#7d9a85;background:#f7faf8}.excel-actions .excel-clear{color:#b14d3d}
.iatf-qty{width:48px!important;min-width:48px!important;max-width:48px;text-align:center;padding-left:2px!important;padding-right:2px!important}.iatf-result{width:66px!important;min-width:66px!important;max-width:66px;text-align:center;text-transform:uppercase;padding-left:2px!important;padding-right:2px!important;font-weight:700}.iatf-sire{min-width:200px!important}.iatf-sire2{min-width:150px!important}.iatf-retorno{min-width:110px!important}
/* Matrizes mais compactas, como um zoom menor, sem alterar o resto do sistema */
.animals-page,.iatf-page,.stock-page{font-size:12px}
.animals-page .table-wrap,.iatf-page .table-wrap,.stock-page .table-wrap{max-height:76vh}
.animals-page table,.iatf-page table,.stock-page table{font-size:11px}
.animals-page th,.iatf-page th,.stock-page th{padding:7px 7px;font-size:9.5px}
.animals-page td,.iatf-page td,.stock-page td{padding:4px 6px}
.animals-page .cell-input,.iatf-page .cell-input,.stock-page .cell-input{padding:3px 4px;min-height:27px;font-size:11px}
.animals-page .notice,.iatf-page .notice,.stock-page .notice{padding:8px 10px;margin-bottom:9px;font-size:11px}
.animals-page .toolbar,.iatf-page .toolbar,.stock-page .toolbar{margin-bottom:7px}
.animals-page .cell-input[style*="min-width:110px"]{min-width:92px!important}

.category-select.cat-vacas{background:#e7f0ff!important;color:#245a9c!important;font-weight:700}

.category-select.cat-preco{background:#efe8ff!important;color:#6743a0!important;font-weight:700}

/* LOGIN FIREBASE */
body.auth-pending .app,body.auth-logged-out .app{display:none!important}
#loginScreen{min-height:100vh;display:none;place-items:center;padding:20px;background:#f5f7f5}

.login-card{width:min(390px,100%);background:#fff;border:1px solid #e1e7e2;border-radius:14px;padding:28px;box-shadow:0 8px 30px #00000010}

</style>

    lastRemoteJSON=JSON.stringify(clean);
    localWritePending=false;
    setSyncStatus('ok','Sincronizado');
  }catch(e){
    console.error('Erro ao sincronizar com Firestore:',e);

async function init(){
  let localDb;
  try{
    const saved=localStorage.getItem(STORE);
    localDb=migrate(saved?JSON.parse(saved):deepClone(DEFAULT_DB));
  }catch(e){
    console.warn('Não foi possível ler o cache local:',e);
    localDb=migrate(deepClone(DEFAULT_DB));
  }
  db=localDb;
  resetUndoBaseline(true);
  bind();
  render();
  setSyncStatus('saving','Conectando...');
  try{
    if(!window.firebase)throw new Error('SDK do Firebase não carregou. Verifique a internet.');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    firestore=firebase.firestore();
    stateRef=firestore.collection('iatfApp').doc('state');
    const snap=await stateRef.get();
    if(snap.exists && snap.data() && snap.data().db){
      applyingRemote=true;
      db=migrate(snap.data().db);
      localStorage.setItem(STORE,JSON.stringify(db));
      lastRemoteJSON=JSON.stringify(deepClone(db));
      resetUndoBaseline(true);
      applyingRemote=false;
      render();
      setSyncStatus('ok','Sincronizado');
    }else{
      // Primeira abertura: envia a base atual da V6 ao Firestore.
      await stateRef.set({db:deepClone(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      lastRemoteJSON=JSON.stringify(deepClone(db));
      setSyncStatus('ok','Sincronizado');
    }
    unsubscribeFirestore=stateRef.onSnapshot(s=>{
      if(!s.exists || !s.data() || !s.data().db)return;
      const incoming=migrate(s.data().db);
      const incomingJSON=JSON.stringify(deepClone(incoming));
      if(incomingJSON===lastRemoteJSON)return;
      // Se o Firestore devolveu exatamente o estado que já está na tela, é o nosso próprio salvamento.
      // Atualiza só o status e NÃO renderiza a página inteira (evita pulo de rolagem/foco).
      const currentJSON=JSON.stringify(deepClone(db));
      if(incomingJSON===currentJSON){lastRemoteJSON=incomingJSON;setSyncStatus('ok','Sincronizado');return}
      // Enquanto há uma gravação local (inclusive Desfazer), ignora um snapshot remoto antigo
      // para ele não apagar a alteração nem limpar o histórico.
      if(localWritePending)return;
      applyingRemote=true;
      db=incoming;
      lastRemoteJSON=incomingJSON;
      try{localStorage.setItem(STORE,incomingJSON)}catch(e){}
      // Mudança realmente vinda de outro dispositivo: atualiza a base, mas NÃO apaga o histórico local.
      resetUndoBaseline(false);
      applyingRemote=false;
      render();
      setSyncStatus('ok','Sincronizado');
    },err=>{
      console.error('Listener Firestore:',err);
      setSyncStatus('error','Problema de conexão');
    });
    window.addEventListener('online',()=>{setSyncStatus('saving','Reconectando...');syncToFirestore()});
    window.addEventListener('offline',()=>setSyncStatus('offline','Problema de conexão'));
  }catch(e){
    console.error('Erro ao conectar ao Firebase:',e);
    setSyncStatus('error','Problema de conexão');
  }
}

}

function maxIatfCycle(sid=db?.meta?.activeSeasonId){
  const saved=Number((db.iatfMaxCycles||{})[sid]||12);
  const used=Math.max(0,...(db.iatf||[]).filter(r=>r.seasonId===sid).map(r=>Number(r.cycle)||0));
  const configured=Math.max(0,...Object.keys(((db.iatfCycleCategories||{})[sid])||{}).map(Number));
  return Math.max(12,saved,used,configured);
}

}

function cycleStats(){
  const out=[];
  for(let c=1;c<=maxIatfCycle();c++){
    const rr=seasonRows().filter(r=>Number(r.cycle)===c&&isDiagnosed(r.result));
    const p=rr.filter(r=>norm(r.result)==='P').length;
    if(rr.length)out.push({cycle:c,n:rr.length,p,rate:pct(p,rr.length)})
  }return out
}

  const rows=seasonRows().filter(r=>isDiagnosed(r.result)&&r.firstSire);
  const map={};rows.forEach(r=>{const n=r.firstSire;map[n]=map[n]||{name:n,uses:0,preg:0};map[n].uses++;if(norm(r.result)==='P')map[n].preg++});
  const herd=rows.length?rows.filter(r=>norm(r.result)==='P').length/rows.length:0,k=Number(db.settings.bullPriorStrength||5);
  return Object.values(map).map(x=>({...x,rate:pct(x.preg,x.uses),adjusted:pct(x.preg+herd*k,x.uses+k)}))
}

function editAnimalCell(id,key,val,el){
  const a=db.animals.find(x=>x.id===id);if(!a)return;
  val=String(val||'').trim();
  if(key==='rgd'){
    const old=a.rgd;
    if(!val){alert('O RGD não pode ficar vazio.');el.value=old;return}
    if(db.animals.some(x=>x.id!==id&&norm(x.rgd)===norm(val))){alert('Já existe uma matriz com esse RGD.');el.value=old;return}
    a.rgd=val;
    db.iatf.forEach(r=>{if(r.rgd===old)r.rgd=val});
  }else if(key==='firstSire'){
    if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque. Cadastre em Estoque primeiro.`);el.value=el.dataset.prev||'';return}
    a.firstSire=val;
    // espelha em TODAS as IATFs dessa matriz
    db.iatf.forEach(r=>{if(r.rgd===a.rgd)r.firstSire=val});
  }else if(key==='category'){
    a.category=val;
    db.iatf.forEach(r=>{if(r.rgd===a.rgd)r.category=val});
    if(el){el.classList.remove('cat-vacas','cat-primi','cat-preco');el.classList.add(catClass(val));}
  }
  el.dataset.prev=val;
  // Não recria a tabela a cada edição: mantém foco e rolagem exatamente onde estão.
  save();
} window.editAnimalCell=editAnimalCell;

  db.deletedAnimals.unshift({id:uid('del'),deletedAt:new Date().toISOString(),animal:deepClone(a),iatf:launches});

function saveAnimal(id){

function restoreDeletedAnimal(id){
  const d=(db.deletedAnimals||[]).find(x=>x.id===id);if(!d||!d.animal)return;

function getIatfCycleCategories(cycle=iatfCycle){
  const sid=db?.meta?.activeSeasonId;if(!sid)return [];
  db.iatfCycleCategories=db.iatfCycleCategories||{};
  db.iatfCycleCategories[sid]=db.iatfCycleCategories[sid]||{};
  return db.iatfCycleCategories[sid][String(Number(cycle))]||[];
}
function setIatfCycleCategories(cycle,cats){
  const sid=db.meta.activeSeasonId;
  db.iatfCycleCategories=db.iatfCycleCategories||{};
  db.iatfCycleCategories[sid]=db.iatfCycleCategories[sid]||{};
  db.iatfCycleCategories[sid][String(Number(cycle))]=[...new Set(cats)];
}
function iatfRowsFiltered(){
  const cats=getIatfCycleCategories(iatfCycle);
  let rows=seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)&&(!cats.length||cats.includes(r.category))).filter(r=>excelPass('iatf',r));
  const k=iatfSort.key,d=iatfSort.dir;rows.sort((a,b)=>String(a[k]??'').localeCompare(String(b[k]??''),'pt-BR',{numeric:true})*d);return rows
}
function sortIatf(k){if(iatfSort.key===k)iatfSort.dir*=-1;else iatfSort={key:k,dir:1};renderIatfRows()} window.sortIatf=sortIatf;
function iff(k,v){iatfFilters[k]=v;renderIatfRows()} window.iff=iff;
function eligibleForIatf(a,cycle){
  if(!a||!a.rgd)return false;
  // Para a categoria escolhida: quem nunca entrou antes aparece; quem já entrou volta se
  // o último diagnóstico anterior for V ou se ainda estiver sem resultado.
  const previous=seasonRows().filter(r=>r.rgd===a.rgd&&Number(r.cycle)<Number(cycle)).sort((x,y)=>Number(y.cycle)-Number(x.cycle));
  if(!previous.length)return true;
  const latest=previous[0];
  const res=normResult(latest.result);
  return !res || res==='V';
}
function isIatfExcluded(rgd,cycle=iatfCycle){
  const sid=db?.meta?.activeSeasonId;
  return (db.iatfExcluded||[]).some(x=>x.seasonId===sid&&Number(x.cycle)===Number(cycle)&&x.rgd===rgd);
}
function prepareIatfCategories(){
  const cats=getIatfCycleCategories(iatfCycle);if(!cats.length)return;
  const existing=new Set(seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)).map(r=>r.rgd));
  let changed=false;
  cats.forEach(cat=>{
    db.animals.filter(a=>a.category===cat&&eligibleForIatf(a,iatfCycle)).forEach(a=>{
      if(existing.has(a.rgd)||isIatfExcluded(a.rgd,iatfCycle))return;
      db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:a.category,cycle:iatfCycle,rgd:a.rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});
      existing.add(a.rgd);changed=true;
    });
  });
  if(changed)save();
}
function toggleIatfCategory(cat,checked){
  let cats=getIatfCycleCategories(iatfCycle).slice();
  if(checked){if(!cats.includes(cat))cats.push(cat)}
  else{
    cats=cats.filter(c=>c!==cat);
    // Ao desmarcar, apaga somente linhas automáticas ainda totalmente vazias.
    db.iatf=db.iatf.filter(r=>!(r.seasonId===db.meta.activeSeasonId&&Number(r.cycle)===Number(iatfCycle)&&r.category===cat&&!Number(r.qty)&&!normResult(r.result)&&!String(r.return||'').trim()&&!String(r.secondSire||'').trim()));
  }
  setIatfCycleCategories(iatfCycle,cats);
  if(checked)prepareIatfCategories();else save();
  renderIatfRows();
} window.toggleIatfCategory=toggleIatfCategory;

function iatfEnter(e,cls){if(e.key!=='Enter')return;e.preventDefault();e.target.blur();const els=$$('.'+cls);const i=els.indexOf(e.target);if(els[i+1]){els[i+1].focus();els[i+1].select()}} window.iatfEnter=iatfEnter;

} window.openPrtPanel=openPrtPanel;

function returnPrts(){
  const picks=$$('.prt-pick').filter(x=>x.checked).map(x=>x.value);
  if(!picks.length)return alert('Marque pelo menos uma matriz.');
  const cy=Number($('#prtCycle').value);
  let criadas=0,jaExistiam=0;
  picks.forEach(rgd=>{
    const a=db.animals.find(x=>x.rgd===rgd);if(!a)return;
    if(seasonRows().some(r=>r.rgd===rgd&&Number(r.cycle)===cy)){jaExistiam++;return}

function editStockCell(id,key,val,el){
  const s=db.semen.find(x=>x.id===id);if(!s)return;
  if(key==='name'){
    val=val.trim();const old=s.name;
    if(!val){if(old){alert('O nome do touro não pode ficar vazio.');el.value=old}return}
    if(db.semen.some(x=>x.id!==id&&norm(x.name)===norm(val))){alert('Já existe um cadastro com esse nome.');el.value=old;return}
    s.name=val;db.animals.forEach(a=>{if(a.firstSire===old)a.firstSire=val});db.iatf.forEach(r=>{if(r.firstSire===old)r.firstSire=val})
  }else if(key==='initial'){s.initial=Number(String(val).replace(',','.'))||0}
  else if(key==='used'){
    const v=String(val).trim();
    if(v===''){s.usedOverride=null}                       // vazio = volta ao automático
    else{
      const n=Number(v.replace(',','.'));
      if(!Number.isFinite(n)||n<0){alert('Informe um número válido em "Usado".');renderStock();return}
      s.usedOverride=(n===usedAuto(s))?null:n;            // igual ao automático = mantém automático
    }
  }
  else s[key]=val;
  save();renderStock()
} window.editStockCell=editStockCell;

    {INDICADOR:'Prenhas',VALOR:finalOutcomeCounts().P},
    {INDICADOR:'Vazias',VALOR:finalOutcomeCounts().V},
    {INDICADOR:'PRT',VALOR:finalOutcomeCounts().PRT},
    {INDICADOR:'Doses em saldo',VALOR:db.semen.reduce((a,s)=>a+stockBalance(s),0)},
    {INDICADOR:'Gerado em',VALOR:new Date().toLocaleString('pt-BR')},
  ];
  const add=(rows,nome)=>{if(!rows.length)return;const ws=XLSX.utils.json_to_sheet(rows);ws['!autofilter']={ref:ws['!ref']};XLSX.utils.book_append_sheet(wb,ws,nome)};
  add(resumo,'Resumo');add(iatfRows,'IATF');add(matRows,'Matrizes');add(stkRows,'Estoque');

} window.exportSeasonAll=exportSeasonAll;

/* EXCEL */
function needXLSX(){if(typeof XLSX==='undefined'){alert('A biblioteca do Excel não carregou. Verifique sua internet e abra novamente o arquivo no Chrome/Edge.');return false}return true}
function downloadWorkbook(wb,name){XLSX.writeFile(wb,name)}
function downloadAnimalTemplate(){
  if(!needXLSX())return;
  const wb=XLSX.utils.book_new();
  const data=[['RGD'],[''],[''],[''],['']];
  const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:24}];

  const inst=XLSX.utils.aoa_to_sheet([['INSTRUÇÕES'],['Cole na coluna RGD apenas os números/nomes das matrizes, um por linha.'],['Categoria e 1º acasalamento são preenchidos depois, direto no site.'],['RGDs que já existirem no cadastro são ignorados automaticamente.']]);inst['!cols']=[{wch:90}];XLSX.utils.book_append_sheet(wb,inst,'LEIA-ME');
  downloadWorkbook(wb,'modelo_matrizes.xlsx')
} window.downloadAnimalTemplate=downloadAnimalTemplate;
function downloadStockTemplate(){
  if(!needXLSX())return;const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([['TOURO','RGD_TOURO','BOTIJAO','CANECA','QTD_DOSES','DATA_ENTRADA'],['','','','','','']]);ws['!cols']=[{wch:34},{wch:22},{wch:14},{wch:12},{wch:14},{wch:16}];ws['!autofilter']={ref:'A1:F2'};XLSX.utils.book_append_sheet(wb,ws,'IMPORTAR');downloadWorkbook(wb,'modelo_estoque_semen.xlsx')
} window.downloadStockTemplate=downloadStockTemplate;
function readExcel(file,cb){if(!file||!needXLSX())return;const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(fr.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}))}catch(e){alert('Não consegui ler o Excel: '+e.message)}};fr.readAsArrayBuffer(file)}
function pick(row,names){const keys=Object.keys(row);for(const n of names){const k=keys.find(k=>norm(k)===norm(n));if(k)return row[k]}return''}
function importAnimalsExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const existing=new Set(db.animals.map(a=>norm(a.rgd)));
    const novos=[],ignorados=[];
    rows.forEach(r=>{
      const rgd=String(pick(r,['RGD','MATRIZ','MATRIZES'])||Object.values(r)[0]||'').trim();
      if(!rgd)return;
      if(existing.has(norm(rgd))||novos.some(x=>norm(x)===norm(rgd))){ignorados.push(rgd);return}
      novos.push(rgd)
    });
    if(!novos.length)return alert('Nenhum RGD novo encontrado no arquivo.'+(ignorados.length?` ${ignorados.length} já estavam cadastrados.`:''));
    novos.forEach(rgd=>db.animals.push({id:uid('a'),rgd,firstSire:'',category:'Vacas',active:true}));
    save();
    alert(`${novos.length} matriz(es) importada(s).`+(ignorados.length?`\n${ignorados.length} já existiam e foram ignoradas.`:'')+'\n\nAgora preencha categoria e 1º acasalamento direto na tabela.');
    if(page==='animals')animals()
  })
}
function importStockExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2,name=String(pick(r,['TOURO','CADASTRO_SEMEN','CADASTRO SEMEN','SÊMEN','SEMEN','NOME_BOTIJAO'])).trim(),rgdTouro=String(pick(r,['RGD_TOURO','RGD TOURO','RGD'])).trim(),tank=String(pick(r,['BOTIJAO','BOTIJÃO'])).trim(),caneca=String(pick(r,['CANECA'])).trim(),qRaw=pick(r,['QTD_DOSES','QTD DOSES','QUANTIDADE']),q=Number(String(qRaw).replace(',','.')),date=String(pick(r,['DATA_ENTRADA','DATA ENTRADA'])).trim();
      if(!name&&!rgdTouro&&!tank&&!caneca&&!qRaw&&!date)return;
      if(!name)errs.push(`Linha ${line}: TOURO vazio.`);
      if(!Number.isFinite(q)||q<0)errs.push(`Linha ${line}: QTD_DOSES inválida.`);
      prepared.push({name,rgdTouro,tank,caneca,q,date})
    });
    if(errs.length){showImportErrors('Importação cancelada','Nenhuma entrada de sêmen foi cadastrada.',errs);return}
    prepared.forEach(x=>{const ex=db.semen.find(s=>norm(s.name)===norm(x.name));if(ex){ex.initial=Number(ex.initial||0)+x.q;if(x.rgdTouro)ex.rgdTouro=x.rgdTouro;if(x.tank)ex.tank=x.tank;if(x.caneca)ex.caneca=x.caneca;if(x.date)ex.addedDate=x.date}else db.semen.push({id:uid('s'),name:x.name,rgdTouro:x.rgdTouro,tank:x.tank,caneca:x.caneca,initial:x.q,addedDate:x.date,usedOverride:null,active:true})});
    save();alert(`${prepared.length} linha(s) de estoque importadas.`);if(page==='stock')stock()
  })
}
function showImportErrors(titleText,sub,errs){openModal(`<h2>${esc(titleText)}</h2><div class="notice">${esc(sub)}</div><div class="error-list">${errs.map(e=>`<div>• ${esc(e)}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="closeModal()">Entendi</button></div>`)}
function exportAnimals(){if(!needXLSX())return;const rows=animalRowsFiltered().map(a=>({RGD:a.rgd,'1_ACASALAMENTO':a.firstSire,CATEGORIA:a.category,SITUACAO:statusLabel(a.status)}));jsonToXlsx(rows,'matrizes_'+activeSeason().name.replace(/\W+/g,'_')+'.xlsx','Matrizes')} window.exportAnimals=exportAnimals;
function exportIatfRows(rows){if(!needXLSX())return;const out=rows.map(r=>({IATF:Number(r.cycle),DATA_IATF:cycleDate(r.cycle),RGD:r.rgd,'1_ACASALAMENTO':r.firstSire,'2_ACASALAMENTO_CURRAL':r.secondSire||'',QTD:r.qty,RESULTADO:r.result,RETORNO:r.return,CATEGORIA:r.category}));jsonToXlsx(out,'iatf_'+activeSeason().name.replace(/\W+/g,'_')+'.xlsx','IATF')}
function exportStock(){if(!needXLSX())return;const out=stockRowsFiltered().map(s=>({TOURO:s.name,RGD_TOURO:s.rgdTouro||'',BOTIJAO:s.tank,CANECA:s.caneca,QTD_DOSES:s.initial,UTILIZADO:s.used,SALDO:s.saldo,DATA_ENTRADA:s.addedDate}));jsonToXlsx(out,'estoque_semen.xlsx','Estoque')} window.exportStock=exportStock;
function jsonToXlsx(rows,name,sheet){const ws=XLSX.utils.json_to_sheet(rows);ws['!autofilter']={ref:ws['!ref']};const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);downloadWorkbook(wb,name)}

function printStock(){
  const incZero=($('#pkZero')||{value:'nao'}).value==='sim';
  const blank=($('#pkBlank')||{value:'sim'}).value==='sim';
  const useFilters=($('#pkCurrent')||{value:'yes'}).value==='yes';
  const u=usedSemen();
  let rows=useFilters?stockRowsFiltered():db.semen.map(s=>({...s,saldo:stockBalance(s),used:usedEffective(s)}));
  if(!incZero)rows=rows.filter(s=>Number(s.saldo)>0);
  rows=rows.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR',{numeric:true}));
  if(!rows.length){closeModal();return alert('Nenhum registro para imprimir com essa seleção.')}
  const extraH=blank?'<th style="width:70px">Conferido</th><th style="width:110px">Obs.</th>':'';
  const extraD=blank?'<td>&nbsp;</td><td>&nbsp;</td>':'';
  const trs=rows.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.rgdTouro||'')}</td><td>${esc(s.tank||'')}</td><td>${esc(s.caneca||'')}</td><td>${s.initial}</td><td>${s.used}</td><td>${s.saldo}</td>${extraD}</tr>`).join('');
  const tot=rows.reduce((a,s)=>({i:a.i+Number(s.initial||0),u:a.u+Number(s.used||0),sa:a.sa+Number(s.saldo||0)}),{i:0,u:0,sa:0});

} window.printStock=printStock;

/* AUTENTICAÇÃO FIREBASE */
let appStarted=false;
function authMessage(code){
  const map={
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'Digite um e-mail válido.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente novamente.',
    'auth/network-request-failed':'Sem conexão com a internet.'
  };
  return map[code]||'Não foi possível entrar. Verifique os dados e tente novamente.';
}
async function bootAuth(){
  try{
    if(!window.firebase)throw new Error('SDK do Firebase não carregou.');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const form=document.getElementById('loginForm');
    const btn=document.getElementById('loginButton');
    const err=document.getElementById('loginError');
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      err.textContent='';btn.disabled=true;btn.textContent='Entrando...';
      try{
        await auth.signInWithEmailAndPassword(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
        document.getElementById('loginPassword').value='';
      }catch(ex){err.textContent=authMessage(ex.code)}
      finally{btn.disabled=false;btn.textContent='Entrar'}
    });

    document.getElementById('logoutBtn').addEventListener('click',async()=>{await auth.signOut();location.reload()});

    auth.onAuthStateChanged(user=>{
      if(user){
        document.body.classList.remove('auth-pending','auth-logged-out');
        document.body.classList.add('authenticated');
        if(!appStarted){
          appStarted=true;
          init().catch(e=>{console.error(e);setSyncStatus('error','Problema de conexão')});
        }
      }else{
        if(appStarted){location.reload();return}
        document.body.classList.remove('auth-pending','authenticated');
        document.body.classList.add('auth-logged-out');
        if(unsubscribeFirestore){try{unsubscribeFirestore()}catch(e){} unsubscribeFirestore=null}
        firestore=null;stateRef=null;
      }
    });
  }catch(e){
    console.error('Erro ao iniciar autenticação:',e);
    document.body.classList.remove('auth-pending');
    document.body.classList.add('auth-logged-out');
    const err=document.getElementById('loginError');
    if(err)err.textContent='Não foi possível conectar ao Firebase.';
  }
}
bootAuth();
